schema_version: 1
# Canonical submission surface per scheduler type. These are properties of the
# scheduler, not of any site, so they are recorded once here rather than restated
# in every machine profile. A machine profile names its scheduler type and adds
# only what its site genuinely changes or provides.
#
# Populate an entry from fact, not from anticipation: a scheduler with no
# profiled machine has no entry until one is onboarded.
surfaces:
  slurm:
    submit_command: sbatch
    interactive_command: salloc
    query_command: squeue
    queues_command: sinfo
    directive_prefix: "#SBATCH"
    account_option: "--account"
    account_option_short: "-A"
    chdir_option: "--chdir"
    chdir_option_short: "-D"
    output_option: "--output"
    output_option_short: "-o"
    error_option: "--error"
    error_option_short: "-e"
    append_output_option: "--open-mode=append"
    exclude_nodes_option: "--exclude"
    exclude_nodes_option_short: "-x"
    nodelist_option: "--nodelist"
    nodelist_option_short: "-w"
    constraint_option: "--constraint"
    constraint_option_short: "-C"
    job_id_variable: SLURM_JOB_ID
    array_job_id_variable: SLURM_ARRAY_JOB_ID
    array_task_id_variable: SLURM_ARRAY_TASK_ID
    submit_dir_variable: SLURM_SUBMIT_DIR
    cpus_per_task_option: "--cpus-per-task"
    cpus_per_task_option_short: "-c"
    tasks_per_node_option: "--ntasks-per-node"
    parallel_launcher: srun
    task_label_option: "--label"
    # The controller's own record of the job as requested and granted. It is
    # purged a site-configured interval after the job leaves the queue, so a
    # job that does not capture it loses it -- unlike the accounting record,
    # which persists and can be re-queried.
    control_command: scontrol
    job_record_option: "show job"
    accounting_command: sacct
    live_step_command: sstat
    accounting_job_option: "--jobs"
    accounting_job_option_short: "-j"
    accounting_format_option: "--format"
    accounting_units_option: "--units"
    # Per-step host memory, plus the node that set the maximum. MaxRSS is the
    # maximum over the step's tasks, not a job-wide mean, so MaxRSSNode is what
    # makes a per-node ceiling comparison possible at all.
    step_accounting_fields: "JobID,JobName,Elapsed,NNodes,NTasks,MaxRSS,MaxRSSNode,AveRSS,MaxVMSize,State,ExitCode"
evidence: docs
observed: "2026-08-28"
observed_on:
  requirements: scheduler-submission-surface
review_by: "2027-08-28"
sources:
  - https://slurm.schedmd.com/sbatch.html
  - https://slurm.schedmd.com/salloc.html
  - https://slurm.schedmd.com/squeue.html
  - https://slurm.schedmd.com/sinfo.html
  - https://slurm.schedmd.com/srun.html
  - https://slurm.schedmd.com/sacct.html
  - https://slurm.schedmd.com/sstat.html
