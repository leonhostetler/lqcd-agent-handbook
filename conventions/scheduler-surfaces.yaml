schema_version: 1
# Canonical submission surface per scheduler type. These are properties of the
# scheduler, not of any site, so they are recorded once here rather than restated
# in every machine profile. A machine profile names its scheduler type and adds
# only what its site genuinely changes or provides.
#
# Populate an entry from fact, not from anticipation: a scheduler with no
# profiled machine has no entry until one is onboarded.
surfaces:
  slurm:
    submit_command: sbatch
    interactive_command: salloc
    query_command: squeue
    queues_command: sinfo
    directive_prefix: "#SBATCH"
    account_option: "--account"
    account_option_short: "-A"
    chdir_option: "--chdir"
    chdir_option_short: "-D"
    # Without the chdir option a job starts in the directory the submit command ran in.
    unpinned_start_directory: submission
    output_option: "--output"
    output_option_short: "-o"
    error_option: "--error"
    error_option_short: "-e"
    append_output_option: "--open-mode=append"
    exclude_nodes_option: "--exclude"
    exclude_nodes_option_short: "-x"
    nodelist_option: "--nodelist"
    nodelist_option_short: "-w"
    constraint_option: "--constraint"
    constraint_option_short: "-C"
    job_id_variable: SLURM_JOB_ID
    array_job_id_variable: SLURM_ARRAY_JOB_ID
    array_task_id_variable: SLURM_ARRAY_TASK_ID
    submit_dir_variable: SLURM_SUBMIT_DIR
    cpus_per_task_option: "--cpus-per-task"
    cpus_per_task_option_short: "-c"
    tasks_per_node_option: "--ntasks-per-node"
    parallel_launcher: srun
    # A step passing this option shares the allocation with steps already running;
    # one that does not claims it exclusively and is refused while any step holds it.
    launcher_overlap_option: "--overlap"
    task_label_option: "--label"
    # Ends a step when any task exits non-zero. Unset, the site's KillOnBadExit default
    # decides. The short form takes its value with no space (-K1), so pass it bare.
    launcher_kill_on_bad_exit_option: "--kill-on-bad-exit"
    launcher_kill_on_bad_exit_option_short: "-K"
    # Given to the parallel launcher inside an allocation, this limits that step only.
    launcher_time_limit_option: "--time"
    launcher_time_limit_option_short: "-t"
    # The controller's own record of the job as requested and granted. It is
    # purged a site-configured interval after the job leaves the queue, so a
    # job that does not capture it loses it -- unlike the accounting record,
    # which persists and can be re-queried.
    control_command: scontrol
    job_record_option: "show job"
    accounting_command: sacct
    live_step_command: sstat
    accounting_job_option: "--jobs"
    accounting_job_option_short: "-j"
    accounting_format_option: "--format"
    accounting_units_option: "--units"
    # Per-step host memory, plus the node that set the maximum. MaxRSS is the
    # maximum over the step's tasks, not a job-wide mean, so MaxRSSNode is what
    # makes a per-node ceiling comparison possible at all.
    step_accounting_fields: "JobID,JobName,Elapsed,NNodes,NTasks,MaxRSS,MaxRSSNode,AveRSS,MaxVMSize,State,ExitCode"
  pbs:
    # PBS Professional. Interactive jobs are the submit command with -I, so the two
    # commands are the same word; queue status is qstat -Q.
    submit_command: qsub
    interactive_command: qsub
    query_command: qstat
    queues_command: qstat
    directive_prefix: "#PBS"
    account_option: "-A"
    # PBS has no directive that pins a job's working directory. With the default
    # sandbox (unset or HOME) the job starts in the user's home directory, so a script
    # must change to its job directory by absolute path itself.
    chdir_option: null
    unpinned_start_directory: home
    output_option: "-o"
    error_option: "-e"
    # No append option: PBS writes each stream to its destination when the job ends.
    append_output_option: null
    job_id_variable: PBS_JOBID
    array_job_id_variable: PBS_ARRAY_ID
    array_task_id_variable: PBS_ARRAY_INDEX
    # The directory qsub ran in. Under submission by absolute path it is not the job
    # directory, and nothing in PBS makes it the start directory either.
    submit_dir_variable: PBS_O_WORKDIR
    # The job's full record, as requested and granted, with resources_used so far.
    # qstat -x -f reads the same record after the job ends, for as long as the server
    # keeps job history; PBS keeps no per-step record.
    control_command: qstat
    job_record_option: "-f"
    accounting_command: qstat
    # No parallel launcher: MPI launch belongs to the site (a machine profile records it
    # as scheduler.site_launcher).
evidence: docs
observed: "2026-10-05"
observed_on:
  requirements: scheduler-submission-surface
review_by: "2027-08-28"
sources:
  - https://slurm.schedmd.com/sbatch.html
  - https://slurm.schedmd.com/salloc.html
  - https://slurm.schedmd.com/squeue.html
  - https://slurm.schedmd.com/sinfo.html
  - https://slurm.schedmd.com/srun.html
  - https://slurm.schedmd.com/sacct.html
  - https://slurm.schedmd.com/sstat.html
  - PBS Professional 2026.1 qsub(1B), qstat(1B) and pbs_job_attributes(7B) manual pages, as installed with the PBS client
  - Slurm 25.11.8 srun(1) manual page, as installed
  - https://centers.hpc.mil/users/docs/advancedTopics/Job_Arrays.html
