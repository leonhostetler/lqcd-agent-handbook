schema_version: 2
name: milc
summary: Lattice-QCD application suite for gauge generation, spectroscopy, and related calculations, with optional QUDA acceleration.
repository: https://github.com/milc-qcd/milc_qcd.git
default_branch: develop
documentation:
  - https://github.com/milc-qcd/milc_qcd
  - https://github.com/milc-qcd/milc_qcd/blob/a5f8f9fa2b473abb2cf2b4465a34ae4b71c5e785/README_CMAKE.md
build_systems:
  - GNU Make
  - CMake
dependencies:
  - name: QUDA
    purpose: Accelerates staggered solves, fermion links, gauge fixing, smearing, and force paths selected by the build.
    required: false
  - name: QMP
    purpose: Provides message passing for the tested multi-rank build.
    required: false
  - name: QIO
    purpose: Provides USQCD-format file I/O when enabled.
    required: false
  - name: MPI
    purpose: Provides distributed-memory execution when MPP is enabled.
    required: false
interfaces:
  - QUDA MILC interface
  - QMP
  - QIO
capabilities:
  - Gauge generation and measurement applications
  - Staggered and HISQ spectroscopy applications
  - Optional QUDA acceleration
  - Multi-rank execution
build_options:
  WANTQUDA:
    meaning: >-
      Enables the MILC-to-QUDA interface; defines HAVE_QUDA. The WANT_*_GPU switches below
      produce USE_*_GPU defines whether or not WANTQUDA is set, and the Grid back end reads some
      of them too, so QUDA code is guarded on HAVE_QUDA as well as the USE_*_GPU define.
      A staggered target built with WANTQUDA=true also needs an accelerated, Grid, or QPhiX CG
      switch: WANTQUDA drops -DDBLSTORE_FN from KSCGSTORE, while the CPU branch of
      Make_template_combos still selects dslash_fn_dblstore.o, which refuses to compile without
      that define. The CMake build documented in README_CMAKE.md (PR #95, merge d2fd151f,
      2026-10-06) mirrors the Makefile, including that constraint, but spells the GPU switches
      GPU_FN_CG, GPU_FL, GPU_GF, GPU_FF, GPU_GA, GPU_EIG, GPU_GSMEAR, and GPU_CL_BCG, with
      GPU_DEFAULT setting all of them at once; its README lists the targets that fail under
      either build system.
    type: boolean
    capabilities: [QUDA interface]
  WANT_SHIFT_GPU:
    meaning: Routes generic KS covariant shifts through the QUDA MILC interface; defines USE_SHIFT_GPU.
    type: boolean
    capabilities: [QUDA covariant shifts]
  WANT_SPIN_TASTE_GPU:
    meaning: Routes generic KS spin-taste operators through the QUDA MILC interface; defines USE_SPIN_TASTE_GPU.
    type: boolean
    capabilities: [QUDA spin-taste operators]
  WANT_FN_CG_GPU:
    meaning: >-
      Enables accelerated staggered conjugate-gradient solves; defines USE_CG_GPU. Through
      6b9b8a06 a WANTQUDA build also forced WANT_EIG_GPU on; PR #99 (merge d17e9559,
      2026-10-06) commented that Makefile rule out, so from there the Makefile's eigensolver
      switch must be set explicitly. It is required, not optional: at a5f8f9fa a Make build
      with WANT_FN_CG_GPU and without WANT_EIG_GPU does not compile, because
      load_quda_default_eig_args in generic/milc_to_quda_utilities.c reads ks_eigen_param
      members that include/imp_ferm_links.h defines only under USE_EIG_GPU with HAVE_QUDA
      (compiled on DeltaAI, 2026-10-07). The CMake build at a5f8f9fa still sets GPU_EIG
      whenever GPU_FN_CG is on, overriding an explicit -DGPU_EIG=OFF (observed), so there the
      eigensolver is always compiled.
    type: boolean
    capabilities: [QUDA staggered CG]
  WANT_FL_GPU:
    meaning: Enables accelerated fermion-link construction; defines USE_FL_GPU.
    type: boolean
    capabilities: [QUDA fermion links]
  WANT_GF_GPU:
    meaning: Enables accelerated gauge-force support; defines USE_GF_GPU.
    type: boolean
    capabilities: [QUDA gauge force]
  WANT_FF_GPU:
    meaning: Enables accelerated fermion-force support; defines USE_FF_GPU.
    type: boolean
    capabilities: [QUDA fermion force]
  WANT_GAUGEFIX_OVR_GPU:
    meaning: Enables accelerated over-relaxation gauge fixing; defines USE_GAUGEFIX_OVR_GPU.
    type: boolean
    capabilities: [QUDA gauge fixing]
  WANT_GSMEAR_GPU:
    meaning: Enables accelerated Gaussian smearing; defines USE_GSMEAR_GPU.
    type: boolean
    capabilities: [QUDA Gaussian smearing]
  WANT_EIG_GPU:
    meaning: >-
      Enables the accelerated eigensolver and deflation paths; defines USE_EIG_GPU. From
      d17e9559 the QUDA eigensolver object is linked into every WANTQUDA build whether or not
      this is set. The source branches on it between QUDA computing or reading the
      eigenvectors itself (set) and MILC supplying host eigenvectors to QUDA (unset), but at
      a5f8f9fa the unset branch is unreachable from a Make build with WANT_FN_CG_GPU, which
      does not compile without this switch.
    type: boolean
    capabilities: [QUDA eigensolver]
  WANT_CURRENT_GPU:
    meaning: >-
      From d17e9559: routes ks_measure's exact low-mode current through qudaExactCurrent and
      its low-mode source projection through qudaProject; defines USE_CURRENT_GPU, added
      through OCFLAGS rather than CGPU. Needs a QUDA-resident deflation space of both
      parities, which ks_measure loads at start-up when eigenpairs are requested.
    type: boolean
    capabilities: [QUDA exact current]
  WANT_KS_CONT_GPU:
    meaning: >-
      Links the QUDA contraction object ks_meson_mom_quda.o in place of ks_meson_mom.o through
      HAVE_KS_CONT_GPU in Make_template_combos. It also defines USE_KS_CONT_GPU, which no source
      reads at the observed revision.
    type: boolean
    capabilities: [QUDA staggered contractions]
  WANT_CL_BCG_GPU:
    meaning: Enables accelerated clover BiCG solves; defines USE_CL_GPU and also USE_GAUGEFIX_OVR_GPU.
    type: boolean
    capabilities: [QUDA clover solves]
  WANT_GA_GPU:
    meaning: >-
      Enables accelerated gauge-action and gauge-observable paths; defines USE_GA_GPU. Unlike the
      other GPU switches it has no default line in the WANTQUDA block.
    type: boolean
    capabilities: [QUDA gauge observables]
  WANT_MULTIGRID:
    meaning: >-
      In a WANTQUDA build, adds -DMULTIGRID, which compiles MILC's QUDA multigrid solve paths. A
      KSCGMULTI value carrying -DMULTIGRID has the same effect.
    type: boolean
    capabilities: [QUDA staggered multigrid]
  WANT_MIXED_PRECISION_GPU:
    meaning: >-
      Selects the sloppy precision of the accelerated solvers; the Makefile default is 2.
      Value 1 adds -DHALF_MIXED and value 2 adds -DMAX_MIXED to CGPU, which the QUDA call
      sites pass as mixed_precision 1 and 2; QUDA's MILC interface maps 1 to single-precision
      and 2 to half-precision sloppy fields. Value 2 in a double-precision build is therefore
      double-half, not double-single. The multi-shift solver (ks_multicg_offset_quda.c) is the
      exception: before merge a5f8f9fa (PR #93, 2026-10-06) it passed mixed_precision 1 under
      either value, and from that merge value 2 passes 2 only when the zeroth shift's residual
      exceeds 3e-5 and the ratio of the smallest to the largest shifted residual exceeds 4e-3,
      otherwise 1. The Makefile comment saying multi-shift always behaves as HALF_MIXED
      predates that change.
    type: integer
  PRECISION:
    meaning: Selects MILC floating-point precision; value 2 builds double precision.
    type: integer
  MPP:
    meaning: Enables distributed-memory parallel execution.
    type: boolean
    capabilities: [multi-rank execution]
  OMP:
    meaning: Enables OpenMP compilation.
    type: boolean
    capabilities: [OpenMP]
  WANTQMP:
    meaning: Enables QMP communication.
    type: boolean
    capabilities: [QMP communication]
  WANTQIO:
    meaning: Enables QIO linkage and requires QMP.
    type: boolean
    capabilities: [QIO linkage]
  CGEOM:
    meaning: Supplies compile-time fixed node and I/O geometry definitions.
    type: string
    capabilities: [fixed runtime geometry input]
  KSCGMULTI:
    meaning: Selects the staggered multimass solver implementation policy.
    type: string
    capabilities: [hybrid staggered multimass dispatch]
  CTIME:
    meaning: Supplies compile-time timing and reporting definitions.
    type: string
    capabilities: [application timing reports]
evidence: source
observed: "2026-10-07"
