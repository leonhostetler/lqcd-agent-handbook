schema_version: 1
software: milc
profiles:
  ks-spectrum-hisq-quda:
    summary: Double-precision, multi-rank ks_spectrum_hisq application with HISQ links and plain or deflated staggered CG accelerated by QUDA.
    application_guide: software/milc/applications/ks-spectrum.md
    targets: [ks_spectrum_hisq]
    options:
      PRECISION: 2
      MPP: true
      OMP: true
      WANTQUDA: true
      WANT_FN_CG_GPU: true
      WANT_EIG_GPU: true
      WANT_FL_GPU: true
      WANT_GF_GPU: true
      WANT_FF_GPU: true
      WANT_MIXED_PRECISION_GPU: 2
      WANT_GAUGEFIX_OVR_GPU: true
      WANT_GSMEAR_GPU: true
      WANTQMP: true
      WANTQIO: true
      CGEOM: -DFIX_NODE_GEOM -DFIX_IONODE_GEOM
      KSCGMULTI: -DKS_MULTICG=HYBRID
      CTIME: -DNERSC_TIME -DCGTIME -DFFTIME -DFLTIME -DGFTIME -DREMAP -DPRTIME -DIOTIME -DGS_TIME
    capabilities:
      applications: [ks_spectrum_hisq]
      fermion_actions: [hisq]
      precision: [double with double-half QUDA solves]
      parallelism: [qmp, openmp]
      quda_paths:
        - staggered-cg
        - staggered-deflated-cg
        - fermion-links
        - gauge-fixing
        - gauge-force
        - fermion-force
        - gaussian-smearing
      io: [qio-linked]
    composes:
      quda:
        profile: milc-cg
        required_capabilities:
          dirac: [staggered, improved-staggered]
          solvers: [cg, deflated-cg]
          application_interfaces: [milc]
          communication: [qmp]
          io: [qio]
    notes:
      - Capabilities describe compiled paths; each stack records which paths its runtime validation actually exercised.
      - WANT_EIG_GPU is explicit. Through 6b9b8a06 the Makefile forced it on with WANT_FN_CG_GPU, so the validated stacks compiled with it; from d17e9559 the Makefile does not, and without it a fresh-eigenvector request terminates at input. Either way the native-CG deflation path is compiled even when a run supplies no eigenspace.
      - QMP and QIO are supplied by the composed QUDA installation in the validated Frontier stack.
  ks-spectrum-hisq-quda-mg:
    summary: Double-precision, multi-rank ks_spectrum_hisq application with HISQ links and QUDA staggered multigrid, built with the MILC MULTIGRID and MULTISOURCE dispatch defines.
    application_guide: software/milc/applications/ks-spectrum.md
    targets: [ks_spectrum_hisq]
    options:
      PRECISION: 2
      MPP: true
      OMP: true
      WANTQUDA: true
      WANT_FN_CG_GPU: true
      WANT_EIG_GPU: true
      WANT_FL_GPU: true
      WANT_GF_GPU: true
      WANT_FF_GPU: true
      WANT_MIXED_PRECISION_GPU: 2
      WANT_GAUGEFIX_OVR_GPU: true
      WANT_GSMEAR_GPU: true
      WANTQMP: true
      WANTQIO: true
      CGEOM: -DFIX_NODE_GEOM -DFIX_IONODE_GEOM
      KSCGMULTI: -DKS_MULTICG=HYBRID -DMULTISOURCE -DMULTIGRID
      CTIME: -DNERSC_TIME -DCGTIME -DFFTIME -DFLTIME -DGFTIME -DREMAP -DPRTIME -DIOTIME -DGS_TIME
    capabilities:
      applications: [ks_spectrum_hisq]
      fermion_actions: [hisq]
      precision: [double with double-half QUDA solves]
      parallelism: [qmp, openmp]
      quda_paths:
        - staggered-cg
        - staggered-deflated-cg
        - staggered-multigrid
        - fermion-links
        - gauge-fixing
        - gauge-force
        - fermion-force
        - gaussian-smearing
      io: [qio-linked]
    composes:
      quda:
        profile: mg-staggered
        required_capabilities:
          dirac: [staggered, improved-staggered]
          solvers: [cg, deflated-cg, gcr, multigrid]
          preconditioners: [staggered multigrid]
          application_interfaces: [milc]
          communication: [qmp]
          io: [qio]
    notes:
      - This profile differs from ks-spectrum-hisq-quda in exactly two respects, and both matter. KSCGMULTI adds -DMULTIGRID (it also carries -DMULTISOURCE, which no source reads at the observed revision), and the composed QUDA profile is mg-staggered rather than milc-cg.
      - -DMULTIGRID compiles MILC's QUDA multigrid paths. In the observed GNU Make path it comes from either this profile's KSCGMULTI or WANT_MULTIGRID=true in a WANTQUDA build; the base profile's WANT_* set leaves WANT_MULTIGRID at its default of false, so it compiles no MG dispatch.
      - The multi-right-hand-side dispatch that reaches qudaInvertMsrcMG is compiled under HAVE_QUDA and MULTIGRID and selected at run time by an MG inverter type on a multi-source set. It is independent of the QUDA_MULTIGRID_MRHS_LIST compiled shapes and of the runtime use_mma switch.
      - Capabilities describe compiled paths; each stack records which paths its runtime validation actually exercised.
      - WANT_EIG_GPU is explicit here for the same reason as in ks-spectrum-hisq-quda; the native-CG deflation path is compiled even when a run supplies no eigenspace.
      - The composed QUDA installation must instantiate the requested coarse colours in QUDA_MULTIGRID_NVEC_LIST. A legal aggregation whose nvec is absent from that list fails at runtime, not at configure time.
  wilson-flow-quda:
    summary: Double-precision, multi-rank Wilson-flow applications using QUDA for gauge evolution and observables.
    application_guide: software/milc/applications/wilson-flow.md
    targets: [wilson_flow, wilson_flow_bbb]
    options:
      PRECISION: 2
      MPP: true
      OMP: true
      WANTQUDA: true
      WANTQMP: true
      WANTQIO: true
      CTIME: -DNERSC_TIME -DCGTIME -DFFTIME -DFLTIME -DGFTIME -DREMAP -DPRTIME -DIOTIME -DGS_TIME
    capabilities:
      applications: [wilson_flow, wilson_flow_bbb]
      flow_actions: [wilson, symanzik]
      integrators: [luescher-rk3, bbb-rk4]
      precision: [double]
      parallelism: [qmp, openmp]
      quda_paths: [wilson-flow, gauge-observables]
      io: [qio-linked]
    composes:
      quda:
        profile: milc-cg
        required_capabilities:
          gauge_operations: [wilson-flow]
          application_interfaces: [milc]
          communication: [qmp]
          io: [qio]
    notes:
      - Only the Luescher and BBB target families are accepted by the QUDA wrapper at the observed revision.
      - Capabilities describe compiled paths; each stack records the target, action, I/O, and ending-lattice paths exercised at runtime.
