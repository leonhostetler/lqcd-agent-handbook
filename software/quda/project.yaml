schema_version: 2
name: quda
summary: GPU-accelerated lattice-QCD library providing Dirac operators, solvers, and application interfaces.
repository: https://github.com/lattice/quda.git
default_branch: develop
documentation:
  - https://lattice.github.io/quda/
  - https://github.com/lattice/quda/wiki
build_systems:
  - CMake
dependencies:
  - name: CUDA, HIP, or SYCL toolchain
    purpose: Compiles QUDA for the selected accelerator target.
    required: true
  - name: QMP or MPI
    purpose: Provides multi-GPU communication when the corresponding backend is enabled.
    required: false
  - name: QIO
    purpose: Provides USQCD binary I/O when QUDA_QIO is enabled; this path requires QMP.
    required: false
  - name: Eigen
    purpose: Supplies host linear algebra used by optional solver paths.
    required: false
interfaces:
  - MILC
  - QDP
  - QDP-JIT
  - OpenQCD
  - CPS
  - BQCD
  - TIFR
capabilities:
  - Wilson, clover, twisted-mass, staggered, improved-staggered, domain-wall, and Mobius Dirac operators
  - Mixed-precision Krylov solvers
  - Multi-GPU execution through QMP or MPI
  - Optional QIO binary I/O
  - Optional adaptive multigrid for supported Wilson- and staggered-type operators
build_options:
  QUDA_TARGET_TYPE:
    meaning: Selects the accelerator backend; accepted values at the observed commit are CUDA, HIP, and SYCL.
    type: string
  QUDA_GPU_ARCH:
    meaning: Selects the accelerator architecture instantiated by the build.
    type: string
  QUDA_DIRAC_DEFAULT_OFF:
    meaning: Makes individual QUDA_DIRAC_* operators opt-in, reducing a specialized build's compile surface.
    type: boolean
  QUDA_DIRAC_STAGGERED:
    meaning: Builds staggered and improved-staggered Dirac operators.
    type: boolean
    capabilities:
      - staggered
      - improved-staggered
  QUDA_DIRAC_COVDEV:
    meaning: Builds the covariant-derivative operator used by shift and spin-taste interface paths.
    type: boolean
    capabilities:
      - covariant derivative
  QUDA_INTERFACE_MILC:
    meaning: >-
      Enables QUDA's MILC host gauge-field orders (it defines BUILD_MILC_INTERFACE, which the
      gauge copy routines and instantiation checks read). The MILC adapter source,
      lib/milc_interface.cpp, is compiled whether or not the option is set.
    type: boolean
    capabilities:
      - MILC interface
  QUDA_RECONSTRUCT:
    meaning: >-
      Three-bit mask selecting which gauge reconstruct types are instantiated, over 18,
      13/12 and 9/8; the observed default 7 compiles all three. Reconstruct is a template
      parameter, so a type absent from the mask cannot be requested at runtime and fails
      naming the mask rather than the request.
    type: string
    capabilities:
      - gauge reconstruct 18
      - gauge reconstruct 13/12
      - gauge reconstruct 9/8
  QUDA_INTERFACE_QDP:
    meaning: Builds the QDP field ordering; QUDA's native staggered validation executables exercise this ordering.
    type: boolean
    capabilities:
      - QDP interface
      - native staggered-test compatibility
  QUDA_QMP:
    meaning: Builds the QMP multi-GPU communication backend.
    type: boolean
    capabilities:
      - QMP communication
  QUDA_MPI:
    meaning: Builds the direct MPI multi-GPU backend; do not enable it together with QUDA_QMP.
    type: boolean
    capabilities:
      - MPI communication
  QUDA_QIO:
    meaning: Builds QIO binary-I/O support and requires QUDA_QMP.
    type: boolean
    capabilities:
      - QIO
  QUDA_MULTIGRID:
    meaning: Builds adaptive multigrid solvers for the supported Dirac operators.
    type: boolean
    capabilities:
      - multigrid
  QUDA_MAX_MULTI_RHS_TILE:
    meaning: >-
      Register tile for the staggered and improved-staggered dslash: the most right-hand sides
      one thread applies the operator to. Default 1; it may not exceed QUDA_MAX_MULTI_RHS. It
      acts on every staggered dslash applied to several right-hand sides at once, multigrid and
      multi-source solves alike, including the invertMultiSrcQuda path the MILC interface's
      multi-source inverter calls, so it is not a multigrid option. A call with fewer
      right-hand sides than the tile falls back to smaller tiles, so results are unchanged;
      whether the larger compiled tile costs a single-RHS call registers is not measured. The
      tile is part of the dslash tuning key (n_rhs_tile), so changing it invalidates those
      tunecache entries. Speed and compile-time cost are not measured here.
    type: integer
  QUDA_DOWNLOAD_USQCD:
    meaning: Downloads and builds the selected USQCD dependencies, including QMP and QIO.
    type: boolean
  QUDA_DOWNLOAD_EIGEN:
    meaning: Downloads Eigen during configuration.
    type: boolean
  QUDA_SCALAR_TYPE:
    meaning: >-
      From f2df42ac4 (PR #1446, 2026-08-22): the host scalar type behind QUDA's real_t and
      complex_t, which carry solver coefficients, eigenvalues, tolerances, and reported
      residuals inside the library. Accepted values are double (the default), doubledouble, and
      float128; the compiler spellings __float128 and _Float128 are normalised to float128.
      float128 needs a compiler with one of those types (configure fails otherwise) and links
      libquadmath on GNU toolchains. Every public-API, Fortran, and MILC-interface boundary
      converts to and from double, as do QUDA's own printed values, so applications see double
      whatever the choice.
    type: string
  QUDA_REDUCTION_TYPE:
    meaning: >-
      From f2df42ac4: the accumulation type of device reductions (norms, inner products, and
      the multi-reductions) and of their cross-rank sum; double (the default) or doubledouble.
    type: string
  QUDA_REDUCTION_ALGORITHM:
    meaning: >-
      From f2df42ac4: NAIVE (the default), REPRODUCIBLE, or KAHAN, which configure rejects as
      not implemented. REPRODUCIBLE accumulates every reduction into binned floating-point
      accumulators (ReproBLAS), so a sum depends only on its summands and not on the order in
      which threads, blocks, or ranks combine them: the device reduction is order-independent,
      and the cross-rank step gathers every rank's bins and adds them instead of calling the
      library allreduce. Reduction results are then bitwise identical across repeated runs,
      launch geometries, and rank decompositions of the same summands; nothing is claimed for
      kernels that are not reductions. An accumulator holds six doubles at the default fold of
      three, so reduction buffers grow accordingly, and the reduction kernels are different
      kernels from NAIVE's. Read from source, not run.
    type: string
  QUDA_NVSHMEM:
    meaning: >-
      Builds the NVSHMEM communication path for the CUDA target; needs QUDA_NVSHMEM_HOME.
      From 2c45a60ae (PR #1645, 2026-08-31) NVSHMEM is resolved as a CMake config package in
      the 3.x layout under QUDA_NVSHMEM_HOME/lib/cmake/nvshmem, its host and device libraries
      are linked privately so that consumers of QUDA's own package, such as MILC's CMake build,
      need no nvshmem targets, and endQuda finalizes NVSHMEM before tearing down the device,
      because NVSHMEM 3.7.0 otherwise dlcloses its transport plugin from an atexit handler
      while its progress thread is still running and segfaults.
    type: boolean
    capabilities:
      - NVSHMEM communication
  QUDA_NVSHMEM_HOME:
    meaning: The NVSHMEM installation prefix; required when QUDA_NVSHMEM is set.
    type: path
  QUDA_DOWNLOAD_CCCL:
    meaning: >-
      From 2c45a60ae: ON (the default) downloads the pinned CCCL through CPM as before; OFF
      uses the CUDA toolkit's own CCCL, which an NVSHMEM 3.x build needs so that QUDA and
      NVSHMEM share one CCCL rather than clashing on libcudacxx and CUB versions.
    type: boolean
  QUDA_64BIT_INDEXING:
    meaning: >-
      From 00c7ef33d (PR #1651, 2026-09-04), advanced: the width of the index arithmetic in
      QUDA's native field accessors, 32-bit unsigned by default and 64-bit when ON. It replaces
      the per-accessor huge-allocation template choice the accessors carried before, so the
      width is one global build property. The merge is the hotfix for an index overflow in the
      cached-load path at large local volumes; whether a 32-bit build refuses or silently
      overflows an oversized local field was not established here, so a per-rank volume near
      the 32-bit limit is a build with the option on, read from source.
    type: boolean
  QUDA_CUDA_NVCC_EXTRA_FLAGS:
    meaning: >-
      From f2df42ac4, advanced: extra flags appended to every nvcc compile line when
      QUDA_CUDA_BUILD_TYPE is NVCC.
    type: string
evidence: source
