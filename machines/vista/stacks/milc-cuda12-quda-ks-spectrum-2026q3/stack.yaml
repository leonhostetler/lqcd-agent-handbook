validation:
  date: "2026-09-28"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 4
    mpi_ranks: 4
    cpus_per_rank: 72
    gpus_per_rank: 1
    visible_gpu_devices_per_rank: 1
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: 9.0
    partition: gh
    exclusive: true
    requested_walltime: 15m
    scheduler_elapsed: 29s
    launcher: ibrun (Open MPI mpirun, --bind-to none at one task per node)
    global_lattice: [16, 16, 16, 32]
    rank_grid: [1, 1, 2, 2]
    local_lattice_per_rank: [16, 16, 8, 16]
    also_run: The same input with node_geometry 1 1 1 1 on one rank and one GPU, in an idev session, passed the same checks.
  runtime:
    communication: QMP over Open MPI 5.0.5 with UCX
    QUDA_ENABLE_GDR: 1
    gdr_confirmed_by: tunecache dslash policy keys carry commDim=0011,p2p=0,gdr=1
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    OMP_NUM_THREADS: 16
    OMP_PROC_BIND: spread
    OMP_PLACES: cores
    cpu_binding: None by the launcher; each rank's affinity was all 72 cores.
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset and one device per node.
    quda_resource_path: Fresh writable tunecache directory for gpu-gh200.
    application_payload_exit_code: 0
    milc_reported_time_seconds: 8.664
    quda_reported_total_time_seconds: 8.243
    batch_node_gpu_memory_peak_mib: 907
    gpu_memory_scope: Sampled at 1 s on the batch node only; a floor for the allocation.
  tests:
    - name: accelerator_telemetry_and_visibility
      devices_per_node: 1
      accelerator: NVIDIA GH200 120GB
      compute_capability: 9.0
      result: pass
    - name: application_completion
      input: upstream systems/Vista/sample.in, unchanged
      input_proofread: tools/milc-proofread-input.sh reached EOF on input with no errors
      terminal_marker: RUNNING COMPLETED
      payload_exit_code: 0
      result: pass
    - name: hisq_fermion_link_construction
      implementation_marker: "FLTIME: time = ... (HISQ QUDA D)"
      result: pass
    - name: quda_cg_convergence
      solves: 24
      requested_true_residual: 1.0e-8
      maximum_true_residual: 9.990874e-9
      minimum_iterations: 73
      maximum_iterations: 4270
      result: pass
    - name: correlator_output_structure
      correlator_records: 12
      time_slices_per_record: 32
      data_rows: 384
      result: pass
    - name: correlator_reference_comparison
      reference: Two earlier Vista runs of the same upstream sample input, built with a different toolchain and older QUDA and MILC revisions
      keys_matched: 12
      maximum_difference_relative_to_record_scale: 1.67e-7
      maximum_single_slice_relative_difference: 8.2e-7
      output_precision: "%.6e (7 significant digits)"
      reference_runs_mutual_difference: 1.41e-7
      negative_control: A 1e-4 relative perturbation of one value was detected.
      result: pass
  scope_limits:
    - Plain CG only. The profile compiled native-CG deflation support, but no eigensolve, deflation-space lifecycle, or deflated solve was exercised.
    - QIO was linked, but the warm-start sample did not exercise QIO file read or write through the application. The composed QUDA stack's multi-rank QIO read-back fails its checksum, so treat multi-rank QIO through this stack as unvalidated.
    - Gaussian smearing, gauge-force, and fermion-force paths were compiled but not exercised by this sample.
    - The gauge-fixing path executed, but acceptance did not assert that its final reported delta met the configured tolerance.
    - GDR device-buffer halos worked in this application run, while QUDA's native multi-node tests fail on the GDR device-buffer policies (see the QUDA stack). The reason MILC escapes is not established, so a larger lattice, different decomposition, or other message sizes may not be covered.
    - Validation covers four nodes at one rank per node and one decomposition. No intra-node multi-rank or P2P path exists on this node type.
    - The run populated a fresh tunecache and is not benchmark evidence.
    - CPU placement was recorded but not tuned; NUMA placement was not captured.
