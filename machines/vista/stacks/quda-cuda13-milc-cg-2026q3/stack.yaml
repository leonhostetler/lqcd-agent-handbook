build:
  type: RELEASE
  target: CUDA
  gpu_arch: sm_90
  generator: Unix Makefiles
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#milc-cg
  machine_options:
    CMAKE_C_COMPILER: mpicc
    CMAKE_CXX_COMPILER: mpicxx
    QUDA_TARGET_TYPE: CUDA
    QUDA_GPU_ARCH: sm_90
    CMAKE_INSTALL_LIBDIR: lib
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: interactive
    command: cmake --build <build-dir> --target install --parallel 32
    parallelism: 32
    wallclock: 7m19.58s
    timing_scope: Clean build and install after a successful fresh configure (83.8 s), complete test suite included, on one gpu-gh200 node in an idev session.
    maximum_reported_rss_kib: 3317760
    memory_scope: Maximum RSS of any single process in the build, from getrusage(RUSAGE_CHILDREN), not aggregate build-process memory.
validation:
  date: "2026-09-28"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 4
    mpi_ranks: 4
    cpus_per_rank: 72
    gpus_per_rank: 1
    visible_gpu_devices_per_rank: 1
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: 9.0
    partition: gh
    exclusive: true
    requested_walltime: 15m
    scheduler_elapsed: 38s
    launcher: ibrun (Open MPI mpirun, --bind-to none at one task per node)
    rank_grid: [1, 1, 1, 4]
    also_run: >-
      One rank on one GPU (installed dslash, CG and QIO tests), and two ranks sharing one GH200
      over the HCA (QUDA_ENABLE_MPS=1, QUDA_ENABLE_P2P=0, UCX_TLS=rc_mlx5,ud_mlx5,cuda_copy,gdr_copy)
      in an idev session; every leg passed.
  runtime:
    communication: QMP over Open MPI 5.0.9 with UCX 1.20.0
    UCX_TLS: unset (deliberately; UCX default transport list, gdr_copy included)
    QUDA_ENABLE_GDR: 1
    gdr_confirmed_by: >-
      Tunecache dslash policy keys carry gdr=1, and UCX_PROTO_INFO=y tables show inter-node
      "rendezvous data fetch into cuda/GPU0 from cuda" (GPU-to-GPU zero-copy RDMA) in the large
      dslash and inverter legs
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    OMP_NUM_THREADS: 16
    OMP_PROC_BIND: spread
    OMP_PLACES: cores
    cpu_binding: None by the launcher; each rank's affinity was all 72 cores.
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset and one device per node.
    resource_path: Fresh writable tunecache directory per leg for gpu-gh200.
    test_executables: Installed usqcd/bin tests.
  tests:
    - name: staggered_dslash_test_single_gpu
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 3.650151e-9
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test_single_gpu
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      iterations: 180
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.378542e-7
      result: pass
    - name: io_test_single_rank
      filter: Gauge/GaugeIOTest.*
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
    - name: staggered_dslash_test_4_node_gdr
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      legs:
        - {local_lattice: [4, 4, 4, 8], precision: single, dslash_policies: default, l2_relative_deviation: -5.207530e-10}
        - {local_lattice: [4, 4, 4, 8], precision: single, dslash_policies: "2,3", l2_relative_deviation: -5.207530e-10}
        - {local_lattice: [16, 16, 8, 16], precision: double, dslash_policies: "2,3", l2_relative_deviation: 2.220446e-16}
        - {local_lattice: [16, 16, 8, 16], precision: double, dslash_policies: default, l2_relative_deviation: 2.220446e-16}
      reachability: every leg's tunecache holds policy keys with commDim=0001 and gdr=1, and the pol= mask of its restriction
      registration_errors: 0
      result: pass
    - name: staggered_invert_test_4_node_gdr
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      local_lattice: [6, 6, 6, 8]
      iterations: 180
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.760871e-7
      registration_errors: 0
      result: pass
    - name: io_test_4_rank
      filter: Gauge/GaugeIOTest.*
      qio_write_status: 0
      qio_read_status: -14
      failure: QIO_compare_checksum reports a checksum mismatch on read-back
      result: fail
  scope_limits:
    - Multi-rank QIO gauge I/O FAILS a checksum on read-back (status -14), exactly as on quda-cuda12-milc-cg-2026q3, with GDR on here and with GDR on or off there. The single-rank io_test passes. The cause is the open upstream defect in software/qio/parallel-singlefile-writes.md (qio#19, quda#1655); QUDA's parallel single-file QIO write loses data on NFS, independent of GDR and toolchain. Multi-rank QIO writes through this stack are unsafe on $HOME and $SCRATCH and unvalidated elsewhere.
    - GDR was exercised with one rank per node on four nodes, and with two ranks sharing one GPU over the HCA on one node. No run placed two ranks on one node with separate GPUs; this node type has one GPU per node.
    - The MILC interface was compiled here; the composed MILC executable is validated separately by milc-cuda13-quda-ks-spectrum-2026q3.
    - The profile compiled eigensolver support, but no eigensolve or deflated solve was exercised.
    - The selected inverter case checked the L2 residual; its heavy-quark tolerance was inactive.
    - Every leg populated a fresh tunecache; this is validation, not benchmark evidence.
