    maximum_reported_rss_kib: 1687296
    memory_scope: Maximum RSS of any single process in the build, from getrusage(RUSAGE_CHILDREN), not aggregate build-process memory.
validation:
  date: "2026-09-28"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 1
    gpus_per_rank: 1
    visible_gpu_devices: 1
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: 9.0
    partition: gh-dev
    placement: interactive idev session
    launcher: mpirun -np 1 --bind-to none
    rank_grid: [1, 1, 1, 1]
  runtime:
    communication: QMP over Open MPI 5.0.5 (single rank, no inter-rank exchange)
    QUDA_ENABLE_GDR: unset (QUDA default off)
    OMP_NUM_THREADS: 72
    OMP_PROC_BIND: spread
    resource_path: Fresh writable directory for gpu-gh200.
    test_executables: Build-tree tests first; installed usqcd/bin tests re-run after the CMAKE_INSTALL_LIBDIR=lib fix with identical results.
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 3.650151e-9
      maximum_deviation: 6.965717e-6
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      lattice: [6, 6, 6, 8]
      iterations: 180
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.370663e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      lattice: [4, 4, 4, 8]
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
  scope_limits:
    - SUPERSEDED for the work superseded_by names. This stack's openmpi/5.0.5 is pinned to UCX 1.17.0, which breaks GPUDirect RDMA with UCX's default gdr_copy transport (machines/vista/gpu-aware-mpi.md). Use this stack only for single-GPU work or to reproduce its own results.
    - Validated on one rank and one GPU only. No halo exchange between ranks or nodes was exercised by a passing test.
    - Multi-node QUDA native tests FAIL with QUDA_ENABLE_GDR=1. On 2 and 4 nodes, staggered_dslash_test and staggered_invert_test abort after UCX logs ibv_reg_dmabuf_mr ... Invalid argument on memory it classifies as cuda. Policies 2,3 (GDR send and receive) fail; 0,1, 4,5 and 10,11 pass with GDR on, and QUDA_ENABLE_GDR=0 passes; each passing leg's tunecache policy keys confirm the inter-node exchange ran. The cause is that this stack's Open MPI is pinned to UCX 1.17.0, which fails to register GPU memory when UCX's default gdr_copy transport is present (machines/vista/gpu-aware-mpi.md). Use the superseded_by successor for multi-rank GPU work; UCX_TLS=^gdr_copy removed the failure on one node but has not been run across nodes.
    - Multi-node io_test FAILS with a QIO checksum mismatch on read-back (status -14), with GDR on or off, and from both the $HOME and $SCRATCH filesystems (both VAST). Cause not established. The single-rank io_test passes.
    - The MILC interface was compiled here; the composed MILC executable is validated separately by milc-cuda12-quda-ks-spectrum-2026q3.
    - The profile compiled eigensolver support, but no eigensolve or deflated solve was exercised.
    - The selected inverter case checked the L2 residual; its heavy-quark tolerance was inactive.
    - The run populated a fresh tunecache and is not benchmark evidence.
