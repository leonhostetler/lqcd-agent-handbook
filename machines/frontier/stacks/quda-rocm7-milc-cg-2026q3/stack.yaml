build:
  type: RELEASE
  target: HIP
  gpu_arch: gfx90a
  generator: Ninja
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#milc-cg
  machine_options:
    CMAKE_C_COMPILER: hipcc
    CMAKE_CXX_COMPILER: hipcc
    CMAKE_HIP_COMPILER: ROCm clang++ selected by CMake
    QUDA_TARGET_TYPE: HIP
    QUDA_GPU_ARCH: gfx90a
    compile_flags: -I${MPICH_DIR}/include --offload-arch=gfx90a
    link_flags: -Wl,-rpath=${MPICH_DIR}/lib -L${MPICH_DIR}/lib -lmpi plus Cray XPMEM and AMD GCD GTL flags
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: login
    command: cmake --build <build-dir> --target install --parallel 4
    parallelism: 4
    wallclock: 14m10.22s
    timing_scope: Clean build and install after a successful fresh configure; complete test suite excluded and focused tests built separately.
    maximum_reported_rss_kib: 925880
    memory_scope: Maximum RSS reported by GNU time for the command, not aggregate build-process memory.
validation:
  date: "2026-08-17"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 8
    gpus_per_rank: 1
    visible_gpu_devices: 8
    accelerator: AMD Instinct MI250X GCD
    accelerator_memory_bytes: 68702699520
    constraint: nvme
    rank_grid: [1, 1, 2, 4]
  runtime:
    communication: QMP over Cray MPICH
    QUDA_ENABLE_P2P: 0
    QUDA_ENABLE_GDR: 1
    MPICH_GPU_SUPPORT_ENABLED: 1
    gpu_binding: All eight devices remained visible so QUDA could select by local rank.
    cpu_binding: Seven physical cores per rank with Frontier NUMA-aware masks.
    resource_path: Fresh writable directory for gpu-mi250x.
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 8, 8]
      l2_relative_deviation: -3.312774e-9
      maximum_deviation: 8.308044e-6
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      lattice: [6, 6, 12, 8]
      iterations: 182
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.310246e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      lattice: [4, 4, 8, 8]
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
  scope_limits:
    - The MILC interface was compiled, but no MILC executable was linked or run.
    - The profile compiled eigensolver support, but validation did not exercise an eigensolve, preserved deflation space, or deflated solve.
    - Validation covers the P2P-disabled workaround path only.
    - The run populated a fresh tunecache and is not benchmark evidence.
    - Root-rank output enumerated all devices but did not print every rank's selected device ordinal.
evidence: experiment
observed: "2026-08-17"
observed_on:
