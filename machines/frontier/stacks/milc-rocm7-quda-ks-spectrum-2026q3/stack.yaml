  machine_options:
    OFFLOAD: HIP
    MY_CC: hipcc
    MY_CXX: hipcc
    COMPILER: gnu
    OPT: -I${MPICH_DIR}/include -g -pg -ggdb -O3 -Ofast --offload-arch=gfx90a
    LDFLAGS: --verbose -g -Wl,-rpath=${MPICH_DIR}/lib -L${MPICH_DIR}/lib -lmpi
    QUDA_HOME: <quda-install-prefix>
    QMPPAR: <quda-install-prefix>
    QIOPAR: <quda-install-prefix>
    LIBQUDA: -Wl,-rpath,<quda-install-prefix>/lib -L<quda-install-prefix>/lib -lquda -D__gfx90a --amdgpu-target=gfx90a -Wl,-rpath,/opt/rocm-7.1.1/lib -L/opt/rocm-7.1.1/lib -lhiprand -lrocfft -lhipblas -lrocblas -g -pg
  dependency_acquisition:
    mode: existing validated QUDA stack installation
    composed_profile: software/quda/build-profiles.yaml#milc-cg
    network_required: false
  cost:
    where: login
    command: make -j1 ks_spectrum_hisq
    parallelism: 1
    wallclock: 25.97s
    timing_scope: Fresh disposable checkout; application objects, dependent MILC libraries, and final link.
    maximum_reported_rss_kib: 234496
    memory_scope: Maximum RSS reported by GNU time for the make command, not aggregate build-process memory.
