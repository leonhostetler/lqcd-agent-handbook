    milc_reported_time_seconds: 40.64254
    quda_reported_total_time_seconds: 39.951
    scheduler_application_step_max_rss_kib: 1633608
    scheduler_memory_scope: Scheduler-reported application-step task maximum, not aggregate rank memory.
    outer_harness_exit_code: 1
    outer_harness_result: False negative after payload completion because it required positive MILC total_iters.
  tests:
    - name: application_completion
      input: upstream systems/Frontier/sample.in
      terminal_marker: RUNNING COMPLETED
      payload_exit_code: 0
      result: pass
    - name: hisq_fermion_link_construction
      implementation_marker: FLTIME HISQ QUDA D
      result: pass
    - name: quda_cg_convergence
      solves: 24
      requested_true_residual: 1.0e-8
      maximum_true_residual: 9.996404e-9
      minimum_iterations: 73
      maximum_iterations: 4267
      total_reported_quda_iterations: 42571
      convergence_markers: 24
      result: pass
    - name: correlator_output_structure
      correlator_records: 12
      time_slices_per_record: 32
      data_rows: 384
      output_bytes: 24015
      result: pass
  scope_limits:
    - The profile compiled native-CG deflation support, but validation exercised plain CG only; no eigensolve, deflation-space lifecycle, or deflated solve is validated.
    - QIO was linked, but the upstream warm-gauge sample did not exercise QIO file read or write through the MILC application.
    - Gaussian smearing, gauge-force, and fermion-force paths were compiled but not exercised by this sample.
    - The gauge-fixing path executed, but acceptance did not assert that its final reported delta met the configured tolerance.
    - Correlator validation checked file structure and completeness, not agreement with reference correlator values.
    - Validation covers the P2P-disabled workaround path only.
    - The run populated a fresh tunecache and is not benchmark evidence.
    - Root-rank output confirmed local-rank selection and all-device visibility but did not enumerate every selected device ordinal.
    - The outer validation harness false-failed only after the application payload exited zero; MILC total_iters is not a valid acceptance marker at the tested commit.
