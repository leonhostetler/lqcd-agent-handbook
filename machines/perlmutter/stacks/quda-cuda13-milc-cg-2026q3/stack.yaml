validation:
  date: "2026-08-20"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    cpus_per_rank: 32
    gpus_per_rank: 1
    visible_gpu_devices: 4
    accelerator: NVIDIA A100-SXM4-40GB
    accelerator_memory_bytes: 42949672960
    constraint: "gpu&hbm40g"
    rank_grid: [1, 1, 1, 4]
  runtime:
    communication: QMP over Cray MPICH
    QUDA_ENABLE_GDR: 1
    MPICH_GPU_SUPPORT_ENABLED: 1
    gpu_binding: disabled so each rank can enumerate all four devices for QUDA local-rank mapping
    resource_path: fresh writable directory for gpu-a100-40
    scheduler_elapsed: 29s
    validation_wrapper_exit_code: 0
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 6.785938e-10
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      lattice: [6, 6, 6, 8]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.547263e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      lattice: [4, 4, 4, 8]
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
  scope_limits:
    - The focused QUDA tests do not exercise a full MILC workflow; composed application coverage is recorded in the successor MILC stack.
    - Validation covers gpu-a100-40 only; gpu-a100-80 shares sm_80 but remains an inference until exercised.
    - The run populated a fresh tunecache and is not benchmark evidence.
    - Scheduler accounting returned zero or nonrepresentative MaxRSS values, so no runtime memory measurement is claimed.
