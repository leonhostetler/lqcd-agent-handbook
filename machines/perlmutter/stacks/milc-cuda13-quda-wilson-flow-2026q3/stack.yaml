validation:
  date: "2026-08-20"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    cpus_per_rank: 32
    gpus_per_rank: 1
    visible_gpu_devices: 4
    accelerator: NVIDIA A100-SXM4-40GB
    accelerator_memory_mib: 40960
    compute_capability: 8.0
    constraint: "gpu&hbm40g"
    qos: debug
    requested_walltime: 5m
    scheduler_elapsed: 16s
    global_lattice: [4, 4, 4, 8]
    rank_grid: [1, 1, 1, 4]
    local_lattice_per_rank: [4, 4, 4, 2]
  runtime:
    executable: wilson_flow_bbb_gpu
    integrator: INTEGRATOR_BBB
    flow_action: wilson
    precision: double
    start_policy: reload_serial
    ending_policy: forget
    exponential_order: 8
    stepsize: 0.0625
    requested_stoptime: 0.125
    actual_steps: 2
    actual_final_flow_time: 0.125
    communication: QMP over Cray MPICH
    QUDA_ENABLE_GDR: 1
    MPICH_GPU_SUPPORT_ENABLED: 1
    OMP_NUM_THREADS: 32
    p2p: Enabled through the QUDA default between neighboring ranks.
    gpu_binding: Disabled so every rank retained all four devices for QUDA local-rank device mapping.
    cpu_binding: Upstream Perlmutter four-rank NUMA and NIC binding script.
    quda_resource_path: Fresh writable tunecache directory for gpu-a100-40.
    application_payload_exit_code: 0
    milc_reported_flow_time_seconds: 0.5613401
    milc_reported_total_time_seconds: 1.370333
    quda_reported_wflow_time_seconds: 0.342
    quda_reported_total_time_seconds: 0.815
    outer_harness_exit_code: 0
  tests:
    - name: accelerator_telemetry_and_visibility
      devices: 4
      accelerator: NVIDIA A100-SXM4-40GB
      accelerator_memory_mib: 40960
      compute_capability: 8.0
      visible_devices_per_rank: 4
      selected_device_ordinals: [0, 1, 2, 3]
      result: pass
    - name: serial_gauge_reload
      format_reported: NERSC
      checksum_reported: true
      unitarity_check_reported: true
      result: pass
    - name: quda_backend_and_integrator
      backend_marker: Running gradient flow with QUDA
      integrator_marker: Integrator = INTEGRATOR_BBB
      result: pass
    - name: flow_output_contract
      flow_rows: 3
      expected_flow_rows: 3
      finite_numeric_rows: 3
      strictly_increasing_post_initial_times: true
      actual_final_flow_time: 0.125
      result: pass
    - name: application_completion
      terminal_marker: RUNNING COMPLETED
      normal_exit_marker: true
      payload_exit_code: 0
      scheduler_state: COMPLETED
      scheduler_exit_code: "0:0"
      result: pass
  scope_limits:
    - Runtime validation covered the BBB target and Wilson action; the Luescher target compiled but was not run, and Symanzik flow was not exercised.
    - The sample used one serially reloaded NERSC gauge field and forget; QIO reload or save, QUDA ending-lattice save, and continue were not exercised.
    - Flow-row checks established structure, finiteness, cardinality, and endpoint only; they did not compare CPU and QUDA observables or reference values.
    - Validation covers one gpu-a100-40 node and the P2P-enabled default path; no multi-node communication or GDR path was demonstrated.
    - The run populated a fresh tunecache and is correctness evidence, not benchmark evidence.
    - The upstream Perlmutter binding script was used, but no independent NUMA-placement telemetry was captured.
    - The build emitted upstream unused-helper, fixed-size sprintf, and maybe-uninitialized cleanup warnings; the warned QIO and save paths were not exercised.
