  install_layout: <milc-checkout>/ks_spectrum/ks_spectrum_hisq
  profile_options_from: software/milc/build-profiles.yaml#ks-spectrum-hisq-quda-mg
  portable_recipe: software/milc/applications/ks-spectrum.md
  nearest_application_stack: machines/perlmutter/stacks/milc-cuda13-quda-ks-spectrum-2026q3/stack.yaml
  machine_options:
    OFFLOAD: CUDA
    MY_CC: cc
    MY_CXX: CC
    COMPILER: gnu
    ARCH: ""
    GPU_ARCH: nvidia
    OPT: -O3 -Ofast -g
    LDFLAGS: -g
    CUDA_HOME: <cuda-toolkit-prefix>
    QUDA_HOME: <quda-build-dir>
    QMPPAR: <quda-build-dir>/usqcd
    QIOPAR: <quda-build-dir>/usqcd
  dependency_acquisition:
    mode: existing QUDA installation built from the mg-staggered profile
    composed_profile: software/quda/build-profiles.yaml#mg-staggered
    network_required: false
  cost:
    where: login
    command: make -j1 ks_spectrum_hisq
    parallelism: 1
    wallclock: 54.97s
    timing_scope: >-
      Instrumented rebuild of the identical recipe against the same QUDA installation, run in a
      copy of the application directory: 95 application objects and the final link. The
      dependent MILC libraries su3.2.a and complex.2.a were already present and were NOT
      rebuilt, so this scope is narrower than the ks-spectrum-hisq-quda stack's cost. The
      validated executable itself was built on a compute node inside an interactive allocation;
      this measurement was taken on a login node.
    maximum_reported_rss_kib: 145724
    memory_scope: >-
      Maximum RSS reported by GNU time for the make command, not aggregate build-process memory.
validation:
  date: "2026-08-31"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 8
    mpi_ranks: 32
    cpus_per_rank: 16
    gpus_per_rank: 1
    accelerator: NVIDIA A100-SXM4-40GB
    constraint: "gpu&hbm40g"
    global_lattice: [64, 64, 64, 96]
    rank_grid: [2, 2, 2, 4]
    local_lattice_per_rank: [32, 32, 32, 24]
  runtime:
    communication: QMP over Cray MPICH
    outer_solver: GCR on the full staggered system with a QUDA multigrid preconditioner
    milc_inverter_selector: MG
    hierarchy_levels: 3
    near_null_and_terminal_eigenspace: loaded from previously saved single-file vector sets, not regenerated in this run
    quda_resource_path: Pre-warmed tunecache carried in from the study baseline.
    application_payload_exit_code: 0
  tests:
    - name: mg_execution_path
      implementation_marker: "fn_QUDA_MG timer lines present; no CG or UML fallback warning"
      timer_lines: 12
      result: pass
    - name: mg_hierarchy_construction
      markers:
        - "mat_invert_mg_field_gpu: setting up the MG inverter"
        - "mat_invert_mg_field_gpu: MG inverter setup complete"
      result: pass
    - name: application_completion
      terminal_marker: RUNNING COMPLETED
      payload_exit_code: 0
      result: pass
    - name: residual_target_attainment
      requested_targets: [1.0e-8, 1.0e-9, 1.0e-10, 1.0e-12]
      note: Every requested target was met in both the multigrid and the reference arm.
      result: pass
    - name: cross_solver_propagator_agreement
      reference_arm: MILC inv_type CG at the same placement, mass, source, and gauge configuration
      criterion: Predeclared before either arm ran; per-timeslice propagator difference must fall monotonically as the residual target is tightened and end below a bound derived from the measured same-solver floor.
      outcome: Monotone across four rungs and inside the bound at the tightest rung.
      result: pass
  scope_limits:
    - This is the first stack to validate a linked MILC multigrid executable. It supersedes nothing; the native QUDA mg-staggered stack remains the only validation of QUDA's own staggered GCR-MG test path.
    - The composed QUDA installation was configured with QUDA_BUILD_ALL_TESTS and QUDA_INSTALL_ALL_TESTS OFF, which the mg-staggered profile now sets ON. The library is otherwise option-identical to that profile. No QUDA native test executable is installed alongside this build.
    - Validation exercised one hierarchy at one placement on one gauge configuration. No other level count, aggregation block, near-null count, coarse solver, rank decomposition, or node count is validated.
    - The run loaded stored near-null and terminal eigenvector sets. Hierarchy setup from scratch is not what this record validates, and the stored sets carry the QIO partfile layout binding described in software/quda/internals/vector-io-layout.md.
    - The repeatability gate was not satisfied by a repeat of this study. The operator accepted a substitute determinism observation taken on a different, four-level configuration. End-to-end reproducibility of this result is therefore not established.
    - Deflated CG and plain CG are compiled. Plain CG ran only as the correctness reference arm; no deflated solve is validated.
    - The tunecache was pre-warmed, so this is not cold-start evidence and is not benchmark evidence of any kind.
    - No solver timing, iteration count, setup cost, or crossover is recorded here. Those are campaign measurements and remain in the working directory.
