build:
  type: RELEASE
  target: CUDA
  gpu_arch: sm_80
  generator: Unix Makefiles
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#milc-cg
  machine_options:
    CMAKE_C_COMPILER: cc
    CMAKE_CXX_COMPILER: CC
    QUDA_TARGET_TYPE: CUDA
    QUDA_GPU_ARCH: sm_80
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: login
    command: cmake --build <build-dir> --target install --parallel 8
    parallelism: 8
    wallclock: 9m14.68s
    timing_scope: Incremental rebuild after enabling QDP; the compile-definition change rebuilt most of QUDA, but this is not a clean-build timing; complete test suite excluded and focused tests built separately.
    maximum_reported_rss_kib: 1592708
    memory_scope: Maximum RSS reported by GNU time for the command, not aggregate build-process memory.
validation:
  date: "2026-08-15"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    gpus_per_rank: 1
    accelerator: NVIDIA A100-SXM4-40GB
    constraint: "gpu&hbm40g"
    rank_grid: [1, 1, 1, 4]
  runtime:
    communication: QMP over Cray MPICH
    QUDA_ENABLE_GDR: 1
    MPICH_GPU_SUPPORT_ENABLED: 1
    gpu_binding: disabled so each rank can enumerate all four devices for QUDA local-rank mapping
    resource_path: fresh writable directory for gpu-a100-40
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 6.785938e-10
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      lattice: [6, 6, 6, 8]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.547263e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      lattice: [4, 4, 4, 8]
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
  scope_limits:
    - The MILC interface was compiled, but no MILC executable was linked or run.
    - Validation covers gpu-a100-40 only; gpu-a100-80 shares sm_80 but remains an inference until exercised.
    - The run populated a fresh tunecache and is not benchmark evidence.
evidence: experiment
experiments:
  - variable: Slurm GPU binding
    comparison: Per-rank visibility caused QUDA local ranks 1 through 3 to report too few GPUs; disabling binding preserved the remaining run configuration and allowed QUDA to map all four ranks.
  - variable: QUDA_INTERFACE_QDP
    comparison: With corrected GPU visibility held fixed, enabling QDP replaced the missing-interface stop with passing native staggered verification.
observed: "2026-08-15"
observed_on:
  machine: perlmutter
  node_type: gpu-a100-40
  software:
    quda:
      commit: 7733f60bb744204576f82574ece8d8bd454fbcfd
      branch: develop
  toolchain:
    cuda: 12.9.41
    host_compiler: GNU 14.3.0 through Cray wrappers
sources:
