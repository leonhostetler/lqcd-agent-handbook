schema_version: 2
name: perlmutter
aliases:
  - saul
summary: NERSC HPE Cray EX system with CPU-only and NVIDIA A100 GPU compute nodes.
public_login_hosts:
  - perlmutter.nersc.gov
  - saul.nersc.gov
scheduler:
  type: slurm
  # This site sets no scheduler-provided node-local temporary directory.
  # Stated as an explicit null because an omitted key cannot be told apart
  # from one nobody checked; see ARCHITECTURE.md scheduler-surface.
  node_local_tmp_variable: null
filesystems:
  scratch:
    purpose: High-performance temporary storage for active Perlmutter jobs.
    environment_variable: PSCRATCH
    purge_policy: Files not accessed within 8 weeks are eligible for deletion.
site_policy:
  scheduling:
    model: single_queue_with_qos
    default_qos: debug
    default_qos_note: >-
      The site default, which is not necessarily the right one for a given study. debug
      admits at most 8 nodes for at most half an hour, so anything larger or longer must
      name a different QOS explicitly. Decide the QOS before sizing a study, because it
      decides whether walltime or queue wait is the binding cost.
    common_qos:
      - regular
      - debug
      - interactive
      - shared
    qos_limits:
      # Per-QOS ceilings from NERSC's job policy table. These four entries are identical in
      # the Perlmutter CPU and GPU tables, so they are recorded once here rather than per
      # node type; other QOS values do differ between those tables, so read the table for
      # the partition in question before extending this block.
      #
      # max_nodes: null means the QOS imposes no node ceiling of its own. The partition,
      # the machine and the allocation still bind, and gpu-a100-80 carries its own
      # constraint-specific ceiling under node_types.
      #
      # max_nodes for a shared QOS is fractional because the job takes part of one node.
      #
      # charge_factor is omitted where it is 1. premium is the only entry here that is not,
      # and its factor is not a constant: see the note on that entry.
      regular:
        max_nodes: null
        max_walltime_hours: 48
      debug:
        max_nodes: 8
        max_walltime_hours: 0.5
        max_submitted_jobs: 5
        max_running_jobs: 2
      interactive:
        max_nodes: 4
        max_walltime_hours: 4
        max_submitted_jobs: 2
        max_running_jobs: 2
      shared:
        max_nodes: 0.5
        max_walltime_hours: 48
      premium:
        max_nodes: null
        max_walltime_hours: 48
        max_submitted_jobs: 5
        charge_factor: 2
        charge_factor_note: >-
          Not a constant. Premium charges 2x until a project has spent 20 percent of its
          allocation on premium jobs, and 4x after that, so the cost of a premium study
          depends on how much premium the project has already run. Check the project's
          premium usage before costing one, rather than multiplying by 2.
  accounting:
    unit: node-hour
    separate_cpu_and_gpu_pools: true
build_environment:
  login:
    intended_for:
      - editing
      - limited compilation
      - job submission
    recommended_max_parallel_build_jobs: 8
    aggregate_memory_limit_gb: 30
    aggregate_cpu_limit_percent: 12.5
  compute:
    use_for:
      - long builds
      - CPU-intensive builds
      - memory-intensive builds
  compilers:
    recommended_wrappers:
      c: cc
      cxx: CC
      fortran: ftn
    cuda_module: cudatoolkit
profilers:
  nsight_systems:
    commands:
      - nsys
    provided_by_module: cudatoolkit
node_types:
  cpu:
    description: CPU-only compute node.
    cpu:
      vendor: AMD
      model: EPYC 7763
      sockets: 2
      cores_per_socket: 64
    accelerator: null
    queues:
      - name: slurm
        constraint: cpu
    build_constraints:
      target: cpu
    sizing:
      installed_nodes: 3072
      physical_cpu_cores: 128
      host_memory_gb: 512
      network: HPE Slingshot 11
      network_interfaces_per_node: 1
  gpu-a100-40:
    description: GPU compute node with 40 GB A100 accelerators.
    cpu:
      vendor: AMD
      model: EPYC 7763
      sockets: 1
      cores_per_socket: 64
    accelerator:
      vendor: NVIDIA
      arch: sm_80
      per_node: 4
      memory_gb: 40
      interconnect: third-generation NVLink
    queues:
      - name: slurm
        constraint: "gpu&hbm40g"
    build_constraints:
      target: gpu
      gpu_arch: sm_80
    sizing:
      installed_nodes: 1536
      physical_cpu_cores: 64
      # Logical CPUs, not cores: this is the number a per-task CPU request and any
      # binding wrapper's CPU indices are counted in. The scheduler presents the
      # package as 4:16:2 (sockets:cores:threads) where the cpu: block above
      # describes one physical 64-core package; both describe the same hardware.
      hardware_threads_per_core: 2
      logical_cpus_per_node: 128
      host_memory_gb: 256
      network: HPE Slingshot 11
      network_interfaces_per_node: 4
  gpu-a100-80:
    description: GPU compute node with 80 GB A100 accelerators.
    cpu:
      vendor: AMD
      model: EPYC 7763
      sockets: 1
      cores_per_socket: 64
    accelerator:
      vendor: NVIDIA
      arch: sm_80
      per_node: 4
      memory_gb: 80
      interconnect: third-generation NVLink
    queues:
      - name: slurm
        constraint: "gpu&hbm80g"
    limits:
      maximum_nodes_with_memory_specific_constraint: 256
    build_constraints:
      target: gpu
      gpu_arch: sm_80
    sizing:
      installed_nodes: 256
      physical_cpu_cores: 64
      hardware_threads_per_core: 2
      logical_cpus_per_node: 128
      host_memory_gb: 256
      network: HPE Slingshot 11
      network_interfaces_per_node: 4
evidence: docs
observed: "2026-09-21"
observed_on:
  machine: perlmutter
review_by: "2027-02-15"
sources:
  - https://docs.nersc.gov/systems/perlmutter/architecture/
  - https://docs.nersc.gov/connect/
  - https://docs.nersc.gov/jobs/policy/
  - https://docs.nersc.gov/policies/resource-usage/
  - https://docs.nersc.gov/filesystems/perlmutter-scratch/
  - https://docs.nersc.gov/development/compilers/
  - https://docs.nersc.gov/development/compilers/wrappers/
