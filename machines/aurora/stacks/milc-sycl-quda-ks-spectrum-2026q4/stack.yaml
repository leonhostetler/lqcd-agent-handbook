    maximum_reported_rss_kib: 218764
    memory_scope: Maximum RSS reported by GNU time for the make command, not aggregate build-process memory.
validation:
  date: "2026-10-01"
  submitted_by: agent
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    queue: debug
    mpi_ranks: 12
    cpus_per_rank: 8
    gpus_per_rank: one tile
    accelerator: Intel Data Center GPU Max 1550, one tile per rank
    global_lattice: [16, 16, 16, 48]
    rank_grid: [1, 2, 2, 3]
    local_lattice_per_rank: [16, 8, 8, 16]
  runtime:
    communication: QMP over MPICH
    launcher: same as quda-sycl-milc-cg-2026q4
    gpu_binding: same as quda-sycl-milc-cg-2026q4
    cpu_binding: Eight physical cores per rank, skipping the reserved cores 0 and 52; OMP_DISPLAY_AFFINITY showed eight threads on eight distinct cores per rank.
    QUDA_ENABLE_P2P: 0
    QUDA_ENABLE_MPS: 1
    QUDA_ENABLE_GDR: 1
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    OMP_NUM_THREADS: 8
    OMP_PROC_BIND: spread
    quda_resource_path: Fresh writable tunecache directory, shared with the QUDA test legs that ran first.
    executable_dynamic_tag: RUNPATH, <quda-install-prefix>/lib then the MPICH library directory
    libquda_resolved_from: <quda-install-prefix>/lib
    openmp_runtimes_linked: libiomp5 only
    application_payload_exit_code: 0
    milc_reported_time_seconds: 28.45727
    scheduler_job_mem_kib: 134240
    scheduler_memory_scope: PBS resources_used.mem read inside the job before teardown; a lower bound.
  tests:
    - name: application_completion
      input: upstream systems/Aurora/sample.in
      terminal_marker: RUNNING COMPLETED
      payload_exit_code: 0
      result: pass
    - name: hisq_fermion_link_construction
      implementation_marker: FLTIME HISQ QUDA D
      result: pass
    - name: quda_cg_convergence
      solves: 24
      solver_marker: CONGRAD5 fn_QUDA D, masses = 1
      requested_true_residual: 1.0e-8
      maximum_true_residual: 9.992442e-9
      minimum_iterations: 72
      maximum_iterations: 4246
      total_reported_quda_iterations: 42554
      result: pass
    - name: correlator_output_structure
      tool: tools/milc-compare-fnal-correlators.py
      correlator_records: 12
      time_slices_per_record: 48
      structural_problems: 0
      result: pass
    - name: repeat_run_correlator_agreement
      tool: tools/milc-compare-fnal-correlators.py
      comparison: second run of the same binary and input in the same job
      largest_relative_difference: 0
      result: pass
  scope_limits:
    - Built against QUDA feature/sycl; see quda-sycl-milc-cg-2026q4 for why develop cannot be used.
    - The profile compiled native-CG deflation support, but validation exercised plain CG only; no eigensolve, deflation-space lifecycle, or deflated solve is validated.
    - QIO was linked, but the warm-gauge sample did not exercise QIO file read or write through the MILC application.
    - Gaussian smearing, gauge-force, and fermion-force paths were compiled but not exercised by this sample.
    - The gauge-fixing path executed, but acceptance did not assert that its final delta met the configured tolerance.
    - Correlator validation checked structure, completeness and run-to-run agreement, not agreement with reference correlator values.
    - One node only; the P2P-disabled path only.
    - The run populated a fresh tunecache and is not benchmark evidence.
experiments:
  - name: upstream_link_flags_contrast
    variable: LDFLAGS; upstream environment form, giving -g -fopenmp -L<nonexistent> -lgomp, against the command-line value -g -fopenmp
    held_fixed: MILC objects, QUDA installation, input, launcher, binding, node and job
    observations:
      - The upstream-flag executable carries both libgomp.so.1 and libiomp5.so, libgomp first.
      - Under it, OMP_DISPLAY_AFFINITY placed all eight threads of every rank on the first CPU of that rank's mask; the corrected executable placed them on eight distinct cores.
      - Correlators were bit-identical to the corrected executable's for this input.
      - Compute propagators took 22.7 s against 13.3 s for the corrected executable, both with a warm tunecache; one observation each.
