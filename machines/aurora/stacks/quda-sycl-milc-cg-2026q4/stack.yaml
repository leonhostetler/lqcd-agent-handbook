  mpi:
    module: mpich/prd/5.0.0.aurora_test.87e2045
  cmake: 3.31.11
build:
  type: RELEASE
  target: SYCL
  gpu_arch: pvc
  generator: Unix Makefiles
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#milc-cg
  machine_options:
    CMAKE_C_COMPILER: mpicc
    CMAKE_CXX_COMPILER: mpicxx
    CMAKE_INSTALL_LIBDIR: lib
    QUDA_TARGET_TYPE: SYCL
    QUDA_BUILD_SHAREDLIB: true
    environment:
      QUDA_SYCL_TARGETS: spir64_gen
      SYCL_LINK_FLAGS: -Xs "-device pvc" -fsycl-device-code-split=per_kernel -fsycl-max-parallel-link-jobs=32 -flink-huge-device-code -Xs "-options -ze-opt-large-register-file"
      QUDA_WARP_SIZE: 16
      QUDA_MAX_BLOCK_SIZE: 512
      QUDA_MAX_ARGUMENT_SIZE: 2048
      QUDA_TEST_NUMPROCS: 1
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: login
    command: cmake --build <build-dir> --target install --parallel 16
    parallelism: 16
    wallclock: 8m36.06s
    timing_scope: Fresh out-of-source build and install after a fresh configure, complete test suite included (31 installed test executables).
    maximum_reported_rss_kib: 1432260
    memory_scope: Maximum RSS reported by GNU time for the command, not aggregate build-process memory.
validation:
  date: "2026-10-01"
  submitted_by: agent
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    queue: debug
    mpi_ranks: 12
    gpus_per_rank: one tile
    visible_gpu_devices_per_rank: 1
    accelerator: Intel Data Center GPU Max 1550, one tile per rank
    rank_grid: [1, 2, 2, 3]
    two_node_run:
      nodes: 2
      mpi_ranks: 24
      ranks_per_node: 12
      rank_grid: [2, 2, 2, 3]
      queue: debug
  runtime:
    communication: QMP over MPICH
    launcher: mpiexec -n 12 --ppn 12 --cpu-bind list:1-8:9-16:17-24:25-32:33-40:41-48:53-60:61-68:69-76:77-84:85-92:93-100 /soft/tools/mpi_wrapper_utils/gpu_tile_compact.sh
    gpu_binding: ZE_AFFINITY_MASK=<gpu>.<tile> per local rank through ALCF's gpu_tile_compact.sh, so each rank sees one device; QUDA_ENABLE_MPS=1 maps every rank's counted gpuid to 0.
    cpu_binding: Eight physical cores per rank, skipping the reserved cores 0 and 52.
    ZE_FLAT_DEVICE_HIERARCHY: COMPOSITE
    QUDA_ENABLE_P2P: 0
    QUDA_ENABLE_MPS: 1
    QUDA_ENABLE_GDR: 1
    QUDA_DETERMINISTIC_REDUCE: unset
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    MPICH_GPU_SUPPORT_ENABLED: unset; not a Cray MPICH environment
    OMP_NUM_THREADS: 8
    OMP_PROC_BIND: spread
    OMP_PLACES: unset
    ONEAPI_DEVICE_SELECTOR: level_zero:gpu
    MPIR_CVAR_CH4_OFI_ENABLE_GPU_PIPELINE: 1
    tunecache_policy_keys: p2p=0,gdr=1 on all 8 multi-GPU dslash policy rows; commDim 0111 on one node, 1111 on two
    rank_map_observed: Two-node run, one line per rank from inside the tile wrapper. Ranks 0-11 on the first node and 12-23 on the second; on each, local rank r had ZE_AFFINITY_MASK=(r/2).(r%2), so all 24 host and tile pairs were distinct.
    resource_path: Fresh writable directory for gpu-pvc.
    device_memory_monitor: tools/monitor-gpu.sh intel, xpu-smi 1.3.5, 1 s interval, achieved period 1 s
    peak_device_memory_mib: 4798
    peak_device_memory_scope: Whole one-node job including the companion MILC legs; sampled. The two-node job peaked at 4751 MiB on the first node, the only one sampled.
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      local_lattice: [6, 6, 6, 6]
      l2_relative_deviation: 1.576111e-9
      maximum_deviation: 7.112470e-6
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      local_lattice: [6, 6, 6, 6]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.898125e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      local_lattice: [6, 6, 6, 6]
      precisions: [double, single]
      result: pass
    - name: staggered_dslash_test_two_nodes
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      local_lattice: [6, 6, 6, 6]
      rank_grid: [2, 2, 2, 3]
      l2_relative_deviation: 2.872920e-10
      maximum_deviation: 7.039730e-6
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test_two_nodes
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      local_lattice: [6, 6, 6, 6]
      rank_grid: [2, 2, 2, 3]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.785297e-7
      result: pass
    - name: io_test_two_nodes
      filter: Gauge/GaugeIOTest.*
      local_lattice: [6, 6, 6, 6]
      rank_grid: [2, 2, 2, 3]
      precisions: [double, single]
      result: pass
  scope_limits:
    - Built from feature/sycl, not develop. develop at the fork point has no SYCL backend (lib/targets holds cuda, generic and hip only), so this stack does not transfer to a develop checkout.
    - The MILC interface was exercised by the companion milc-sycl-quda-ks-spectrum-2026q4 stack, not by these tests.
    - The profile compiled eigensolver support, but validation did not exercise an eigensolve, preserved deflation space, or deflated solve.
    - Validation covers one and two nodes and the P2P-disabled path only. On two nodes every dimension communicated (commDim 1111), so halos crossed the fabric, but QUDA's small test lattices keep messages in the transport's small-message band and no transport log was taken, so GPU-Direct RDMA over Slingshot is requested (gdr=1) but not shown to move data GPU to GPU.
    - The run populated a fresh tunecache and is not benchmark evidence.
