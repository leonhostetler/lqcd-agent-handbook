schema_version: 2
name: aurora
summary: ALCF HPE Cray EX system with Intel Xeon CPU Max and six Intel Data Center GPU Max 1550 GPUs per node, scheduled by PBS; the handbook's batch-script tools do not yet cover PBS (see notes.md).
public_login_hosts:
  - aurora.alcf.anl.gov
scheduler:
  type: pbs
  # conventions/scheduler-surfaces.yaml has no pbs entry yet, so no surface field is
  # overridden here. The site's launcher is Cray PALS mpiexec; notes.md owns how it is used
  # until the PBS surface records it.
filesystems:
  home:
    purpose: Small files and the binaries to be run on the compute nodes.
    environment_variable: HOME
    type: Lustre (Gecko)
    quota: 50 GB default.
  flare:
    # No environment variable: the site sets none. Scripts name the project directory
    # explicitly, as /lus/flare/projects/<project>.
    purpose: Project storage; ALCF says jobs should be launched from here, not from home.
    path: /lus/flare/projects/<project>
    type: Lustre
    capacity: 91 PB
    quota: 1 TB default per project.
  daos:
    purpose: Object store embedded in the Slingshot fabric, reached through per-project pools and containers rather than as a mounted path.
    type: DAOS
    capacity: 230 PB
site_policy:
  scheduling:
    # Every job names the filesystems it needs, colon-separated, e.g. filesystems=home:flare.
    # A job that omits one cannot rely on it being mounted.
    required_resources:
      - select
      - walltime
      - filesystems
      - place
    valid_filesystems:
      - home
      - flare
      - daos_user
    per_project_limits:
      running_or_accruing_jobs: 10
      queued_jobs: 100
    queue_limits:
      debug:
        node_type: gpu-pvc
        minimum_nodes: 1
        maximum_nodes_per_job: 2
        maximum_walltime_hours: 1
        running_jobs_per_user: 1
      debug-scaling:
        node_type: gpu-pvc
        minimum_nodes: 2
        maximum_nodes_per_job: 256
        maximum_walltime_hours: 1
        running_jobs_per_user: 1
      capacity:
        node_type: gpu-pvc
        minimum_nodes: 1
        maximum_nodes_per_job: 16
        maximum_walltime_hours: 168
        running_jobs_per_user: 2
        queued_jobs_per_user: 5
        maximum_nodes_all_jobs: 512
      prod:
        # A routing queue: jobs land in small, medium or large by size, or in the matching
        # backfill queue when the project's balance is exhausted.
        node_type: gpu-pvc
        routes_to:
          small: {minimum_nodes: 256, maximum_nodes_per_job: 1024, maximum_walltime_hours: 12}
          medium: {minimum_nodes: 1025, maximum_nodes_per_job: 1999, maximum_walltime_hours: 18}
          large: {minimum_nodes: 2000, maximum_nodes_per_job: 10624, maximum_walltime_hours: 24}
build_environment:
  login:
    # Read from lscpu on a login node; not a compute-node CPU.
    hardware: 2 x Intel Xeon Gold 5320, 104 logical CPUs
    accelerator_available: false
    use_for:
      - builds that do not need a GPU while they build
    outbound_network: direct
  compute:
    access: An interactive (qsub -I) or batch job.
    use_for:
      - builds that need a GPU while they build
    # Compute nodes reach the internet only through the ALCF proxy; notes.md has the setting.
    outbound_network: proxy
  module_system: Lmod
  default_programming_environment: oneAPI, with MPICH, libfabric and Cray PALS loaded by default
  additional_modules: module use /soft/modulefiles
  compilers:
    families:
      - oneapi
      - gcc
  mpi_module_family: mpich
  mpi_wrappers: [mpicc, mpicxx, mpifort]
  accelerator_toolchain:
    programming_model: SYCL (oneAPI DPC++)
    gpu_arch: pvc
node_types:
  gpu-pvc:
    description: Aurora compute node, two Xeon CPU Max sockets and six GPU Max 1550 GPUs, each GPU two tiles.
    cpu:
      vendor: Intel
      model: Xeon CPU Max Series (Sapphire Rapids with on-package HBM)
      sockets: 2
      cores_per_socket: 52
      hardware_threads_per_core: 2
    accelerator:
      vendor: intel
      model: Data Center GPU Max 1550 (Ponte Vecchio)
      # Intel's ahead-of-time device name for Ponte Vecchio, as ocloc accepts it (-device pvc).
      arch: pvc
      per_node: 6
      # ALCF gives 768 GiB of HBM2e per node, 128 GiB per GPU; this is that figure in GB.
      memory_gb: 137.4
      tiles_per_gpu: 2
      interconnect: Intel Xe Link, all-to-all between the six GPUs
    queues:
      - name: debug
      - name: debug-scaling
      - name: capacity
      - name: prod
    build_constraints:
      target: gpu
      gpu_arch: pvc
      cpu_arch: x86_64
    sizing:
      installed_nodes: 10624
      physical_cpu_cores: 104
      logical_cpus_per_node: 208
      # Cores 0 and 52 and their hyperthreads 104 and 156 are reserved for system services.
      reserved_cpus: [0, 52, 104, 156]
      host_memory_gb: 1024
      cpu_hbm_gb: 128
      network: 8 x HPE Slingshot-11 NICs, Dragonfly topology
evidence: docs
observed: "2026-09-30"
observed_on:
  machine: aurora
review_by: "2027-03-31"
sources:
  - https://docs.alcf.anl.gov/aurora/
  - https://docs.alcf.anl.gov/aurora/getting-started-on-aurora/
  - https://docs.alcf.anl.gov/aurora/running-jobs-aurora/
  - https://docs.alcf.anl.gov/aurora/compiling-and-linking/
  - https://docs.alcf.anl.gov/aurora/data-management/lustre/flare/
  - https://docs.alcf.anl.gov/aurora/data-management/daos/daos-overview/
  - Aurora login-node lscpu, Lmod default modules, ocloc device list, and PBS qstat -Q, -Qf and -Bf records, read 2026-09-30
