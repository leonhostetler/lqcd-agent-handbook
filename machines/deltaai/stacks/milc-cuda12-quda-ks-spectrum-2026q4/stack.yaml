validation:
  date: "2026-10-07"
  submitted_by: agent
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    cpus_per_rank: 16
    gpus_per_rank: 1
    visible_gpu_devices: 4
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: 9.0
    partition: ghx4-interactive
    exclusive: true
    requested_walltime: 30m
    global_lattice: [16, 16, 16, 32]
    rank_grid: [1, 1, 2, 2]
    local_lattice_per_rank: [16, 16, 8, 16]
  runtime:
    communication: QMP over Cray MPICH
    QUDA_ENABLE_GDR: 1
    QUDA_ENABLE_P2P: deliberately unset
    QUDA_DETERMINISTIC_REDUCE: deliberately unset
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    MPICH_GPU_SUPPORT_ENABLED: 1
    MPICH_RDMA_ENABLED_CUDA: 1
    MPICH_NEMESIS_ASYNC_PROGRESS: 1
    MPICH_SMP_SINGLE_COPY_MODE_requested: XPMEM
    MPICH_SMP_SINGLE_COPY_MODE_reported: CMA
    MPICH_ASYNC_PROGRESS_reported: 0
    MPICH_ENV_DISPLAY: 1
    MPICH_OFI_NIC_VERBOSE: 2
    OMP_NUM_THREADS: 16
    OMP_PROC_BIND: spread
    gpu_binding: Disabled so every rank retained all four devices for QUDA local-rank mapping.
    cpu_binding: Sixteen cores per rank through Slurm core binding; no NUMA map was captured.
    quda_resource_path: Fresh writable tunecache directory per leg for gpu-gh200.
    gdr_evidence: Tunecache policy keys carry p2p=7,gdr=1.
    linked_quda: DT_RPATH resolves libquda.so from the composed install prefix; the install and build-tree copies share one GNU Build ID.
    openmp_runtime: libgomp.so.1, the only OpenMP runtime linked.
  tests:
    - name: accelerator_telemetry_and_visibility
      devices: 4
      accelerator: NVIDIA GH200 120GB
      compute_capability: 9.0
      visible_devices_per_rank: 4
      result: pass
    - name: application_completion
      input: upstream systems/DeltaAI/sample.in, unchanged
      terminal_marker: RUNNING COMPLETED
      payload_exit_code: 0
      result: pass
    - name: hisq_fermion_link_construction
      implementation_marker: "FLTIME: time = ... (HISQ QUDA D)"
      result: pass
    - name: quda_cg_convergence
      solves: 24
      requested_true_residual: 1.0e-8
      maximum_true_residual: 9.992731e-9
      minimum_iterations: 73
      maximum_iterations: 4266
      total_reported_quda_iterations: 42510
      convergence_markers: 24
      result: pass
    - name: correlator_output_structure
      correlator_records: 12
      time_slices_per_record: 32
      data_rows: 384
      result: pass
    - name: quda_eigensolve_and_deflated_cg_first_input_set
      input: two warm input sets, 32 fresh QUDA eigenpairs each, deflated UML multimass at masses 0.002 and 0.001, tolerance 1e-8
      eigensolver: TRLM, 32 vectors, Chebyshev_alpha 1e-4, Chebyshev_beta 0 (QUDA estimate)
      first_input_set_solves_converged: 12 of 12
      first_input_set_maximum_true_residual: 9.98707e-9
      result: pass
  scope_limits:
    - Deflation was exercised only for the first input set of a process. The second input set reused the first set's QUDA-resident deflation space without a fresh eigensolve, and 6 of its 12 deflated solves ended with true residuals between 1 and 3e4 while the run reported completion and exited 0; a build adding qudaCleanUpDeflationSpace() before each load_evecs_quda converged all 12. Run one gauge configuration per process when eigenvectors are QUDA-resident; software/quda/internals/milc-deflation-space.md owns the mechanism.
    - The deflation runs used a warm (random) gauge field, whose lowest 32 eigenvalues lie between 1e-9 and 6.2e-6; Chebyshev_alpha 1, 3, and 10 did not converge on it. The eigensolver parameters are a test choice, not a recommendation for a physical ensemble.
    - LDFLAGS names the GCC OpenMP runtime explicitly. The 2026q3 stack's recorded LDFLAGS of -g did not link on DeltaAI on 2026-10-07, at either MILC commit and against either QUDA commit, with 625 undefined OpenMP references.
    - The build ran at -j1; at -j4 objects compiled before the target recipe generated quark_action.h and failed.
    - QIO was linked, but neither input exercised QIO file read or write through the MILC application.
    - Gaussian smearing, gauge-force, and fermion-force paths were compiled but not exercised.
    - The gauge-fixing path executed in sample.in, but acceptance did not assert that its final reported delta met the configured tolerance.
    - Correlator validation checked structure and completeness for sample.in, not agreement with reference correlator values.
    - Validation covers one gpu-gh200 node and the P2P-enabled default path; no multi-node communication or GDR path was demonstrated.
    - Every leg populated a fresh tunecache and is not benchmark evidence.
    - CPU core binding was exercised, but NUMA placement was not captured or validated.
