validation:
  date: "2026-08-17"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    cpus_per_rank: 16
    gpus_per_rank: 1
    visible_gpu_devices: 4
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: 9.0
    partition: ghx4-interactive
    exclusive: true
    requested_walltime: 15m
    scheduler_elapsed: 25s
    rank_grid: [1, 1, 1, 4]
  runtime:
    communication: QMP over Cray MPICH
    QUDA_ENABLE_GDR: 1
    MPICH_GPU_SUPPORT_ENABLED: 1
    MPICH_RDMA_ENABLED_CUDA: 1
    MPICH_NEMESIS_ASYNC_PROGRESS: 1
    MPICH_SMP_SINGLE_COPY_MODE: XPMEM
    OMP_NUM_THREADS: 16
    gpu_binding: Slurm binding disabled so every rank could see all four devices and QUDA could select by local rank.
    cpu_binding: Sixteen cores per rank through Slurm core binding; no NUMA map was captured.
    peer_to_peer: QUDA enabled peer access between neighboring ranks in the T-decomposed grid.
    resource_path: Fresh writable directory for gpu-gh200.
  tests:
    - name: staggered_dslash_test
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 6.660550e-11
      maximum_deviation: 9.299440e-6
      failures_at_1e-6: 0
      result: pass
    - name: staggered_invert_test
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      operator: asqtad
      solver: cg
      precision: double
      lattice: [6, 6, 6, 8]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.547263e-7
      result: pass
    - name: io_test
      filter: Gauge/GaugeIOTest.*
      lattice: [4, 4, 4, 8]
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
  scope_limits:
    - The MILC interface was compiled, but no MILC executable was linked or run.
    - The selected inverter case checked the L2 residual; its heavy-quark tolerance was inactive.
    - Validation covers one gpu-gh200 node; no multi-node path was exercised.
    - The run populated a fresh tunecache and emitted a tuning-candidate regression warning, so it is not benchmark evidence.
    - CPU core binding was exercised, but NUMA placement was not captured or validated.
