  cost:
    where: login
    command: make -j 1 <target>
    parallelism: 1
    wallclock: not measured
    timing_scope: Clean, then the application objects, dependent MILC libraries and final link, once per target; not timed.
    maximum_reported_rss_kib: not measured
    memory_scope: Not measured.
