      undecided: 0
    - tool: tools/check-stack-build-record.py
      version: 1.0.0
      date: "2026-10-11"
      mode: make
      target: ks_spectrum_hisq_gb_baryon_blind_no_sink_links
      evidence:
        - the same build script, run with the second target; it passes the same make variables
        - ks_spectrum/Makefile of the checkout, copied from the top-level Makefile by the build script
        - the make log, whose header names the tested MILC commit
        - the MILC source checkout at the tested commit
      errors: 0
      undecided: 0
validation:
  date: "2026-10-11"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 3
    accelerator: NVIDIA GH200 120GB
    accelerator_memory_mib: 97871
    compute_capability: "9.0"
    partition: ghx4
    exclusive: true
    legs:
      - {name: fpi, executable: ks_spectrum_hisq, nodes: 3, mpi_ranks: 12, node_geometry: [1, 1, 4, 3]}
      - {name: specnd, executable: ks_spectrum_hisq, nodes: 2, mpi_ranks: 8, node_geometry: [1, 1, 2, 4]}
      - {name: omega, executable: ks_spectrum_hisq_gb_baryon_blind_no_sink_links, nodes: 2, mpi_ranks: 8, node_geometry: [1, 2, 2, 2]}
  runtime:
    communication: QMP over Cray MPICH
    launcher: srun -K, 4 tasks per node, SRUN_CPUS_PER_TASK=32, SLURM_CPU_BIND=cores
    QUDA_ENABLE_GDR: 1
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    MPICH_GPU_SUPPORT_ENABLED: 1
    MPICH_RDMA_ENABLED_CUDA: 1
    OMP_NUM_THREADS: 16
    OMP_PROC_BIND: spread, spread, spread
    gpu_binding: None; every rank sees all four devices and QUDA selects the device by local rank.
    cpu_binding: Thirty-two cores per rank, bound to cores (SLURM_CPU_BIND=cores); the first runs showed one NUMA domain and NIC per rank.
    quda_resource_path: One tunecache per campaign, populated by a first tuning run and then read.
    linked_quda: RPATH resolves libquda, libqmp, libqio and liblime from the composed install prefix, whose files the QUDA stack hashes.
  tests:
    - name: production_benchmark
      workload: three production campaigns on an 80³×144 HISQ ensemble, 10 configurations each, one batch job per campaign
      checks: per configuration, the batch's own completion status, scheduler step COMPLETED, every input set completed and every solve converged by tools/extract-milc-timings.py 1.2.0, and the campaign tunecache read and not rewritten
      configurations_accepted: 30 of 30
      result: pass
  scope_limits:
    - Both targets passed the build-record check. Each was validated by production runs only, with no cross-geometry consistency check.
    - The MILC commit is on fix/baryon-normalization, one commit on develop 6b9b8a06 that reduces KS baryon correlators over ranks once; the commit has since reached develop.
    - Plain and multi-right-hand-side CG and multi-shift CG only. Deflation, QIO file writes, gauge-force and fermion-force paths were compiled but not exercised.
    - The build script passes its make variables through the environment, not on the make command line, so the Makefile's own OpenMP additions are appended to LDFLAGS and the link line carries -fopenmp -lgomp; the same -g passed on the command line replaces them and does not link (milc-cuda12-quda-ks-spectrum-2026q4).
