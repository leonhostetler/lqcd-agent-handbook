      normal_exit_marker: true
      payload_exit_code: 0
      scheduler_state: COMPLETED
      scheduler_exit_code: "0:0"
      result: pass
  scope_limits:
    - Runtime validation covered the BBB target and Wilson action; the Luescher target compiled but was not run, and Symanzik flow was not exercised.
    - The sample used one independently reloaded gauge field and forget; QUDA ending-lattice save and continue were not exercised.
    - Flow-row checks established structure, finiteness, cardinality, and endpoint only; they did not compare CPU and QUDA observables or reference values.
    - Validation covers one gpu-gh200 node and the P2P-enabled default path; no multi-node communication or GDR path was demonstrated.
    - The run populated a fresh tunecache and is correctness evidence, not benchmark evidence.
    - CPU core binding was exercised, but NUMA placement was not captured or validated.
    - The MILC build timing excludes the first compilation that produced reusable archives before failing at final link because command-line LDFLAGS omitted the OpenMP runtime.
