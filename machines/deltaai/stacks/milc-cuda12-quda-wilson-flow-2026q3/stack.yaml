      backend_marker: Running gradient flow with QUDA
      integrator_marker: Integrator = INTEGRATOR_BBB
      result: pass
    - name: flow_output_contract
      flow_rows: 3
      expected_flow_rows: 3
      finite_numeric_rows: 3
      strictly_increasing_post_initial_times: true
      actual_final_flow_time: 0.125
      result: pass
    - name: application_completion
