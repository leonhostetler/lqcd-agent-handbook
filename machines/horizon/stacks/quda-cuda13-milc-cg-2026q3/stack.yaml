schema_version: 1
machine: horizon
software: quda
profile: milc-cg
validated_on:
  - gpu-gb200
tested_software:
  quda:
    commit: 00c7ef33dacadfb94860e3ca1cc06862926182dc
    branch: develop
tested_dependencies:
  qmp:
    commit: 3010fef5b5784b3e6eeec9fff38cb9954a28ad42
    requested_revision: 3010fef
    branch_context: Detached revision selected by QUDA; no branch asserted.
  qio:
    commit: 273841537392f9465d229c957228755e923408eb
    requested_revision: qio3-0-0
    branch_context: Tag selected by QUDA; no branch asserted.
  eigen:
    version: 3.4.0
    requested_revision: 3.4.0
  cccl:
    commit: 413d2efd811ebb2ca0333a281d04a2de838ecad6
    requested_revision: v3.3.4
    branch_context: Tag selected by QUDA; no branch asserted.
tested_toolchain:
  modules: [nvidia/26.9, cuda/13.3, openmpi/5.0.11, ucx/1.22.0]
  host_compiler:
    module: nvidia/26.9
    version: NVHPC 26.9.0 (nvc, nvc++)
    wrappers:
      c: mpicc
      cxx: mpicxx
  cuda:
    module: cuda/13.3
    compiler_version: 13.3.73
    runtime_version: 13.3
  driver: 595.71.05 (CUDA driver API 13.2; the 13.3 runtime ran under minor-version compatibility)
  mpi:
    module: openmpi/5.0.11
    transport: >-
      UCX 1.22.0 from the loaded ucx module. The Open MPI build was configured against UCX
      1.21.0, but libmpi carries no run path to UCX, so the module decides the version; every
      rank reported loading 1.22.0.
  cmake: >-
    3.30.5, the system cmake. The cmake/4.4.0 module's binaries were not executable when this
    stack was built, so the shell fell through to /usr/bin/cmake; configure and build both
    called it explicitly.
build:
  type: RELEASE
  target: CUDA
  gpu_arch: sm_100
  generator: Unix Makefiles
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#milc-cg
  machine_options:
    CMAKE_C_COMPILER: mpicc
    CMAKE_CXX_COMPILER: mpicxx
    QUDA_TARGET_TYPE: CUDA
    QUDA_GPU_ARCH: sm_100
    CMAKE_INSTALL_LIBDIR: lib
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: batch
    command: cmake --build <build-dir> --target install --parallel 64
    parallelism: 64
    wallclock: 679.1s
    timing_scope: Build and install, complete test suite included, on one gpu-gb200 scheduler node in the early-access debug partition. Configure ran beforehand on a login node (84 s), because it downloads QMP, QIO, Eigen and CCCL and compute-node network access was not established.
    maximum_reported_rss_kib: 3373056
    memory_scope: Maximum RSS of any single process in the build, from getrusage(RUSAGE_CHILDREN), not aggregate build-process memory.
validation:
  date: "2026-09-29"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 2
    mpi_ranks: 8
    ranks_per_node: 4
    cpus_per_rank: 36
    gpus_per_rank: 1
    visible_gpu_devices_per_rank: 4
    accelerator: NVIDIA GB200
    accelerator_memory_mib: 189471
    compute_capability: "10.0"
    scheduler_node: >-
      Early access: one scheduler node was a whole GB200 NVL4 board, four GPUs and two
      72-core Grace sockets (GPUs 0-1 on cores 0-71, GPUs 2-3 on cores 72-143), not the
      two-GPU node the machine profile documents; see machines/horizon/notes.md.
    partition: debug
    exclusive: true
    requested_walltime: 20m
    scheduler_elapsed: 1m49s
    launcher: >-
      ibrun (Open MPI mpirun over a hostfile) with OPENMPI_AFFINITY="--map-by slot:PE=36
      --bind-to core"; one-rank legs used ibrun -n 1 -o 0, which ibrun runs with --bind-to none
    rank_grid: [1, 1, 2, 4]
  runtime:
    communication: QMP over Open MPI 5.0.11 with UCX 1.22.0
    UCX_TLS: unset (deliberately; UCX default transport list)
    QUDA_ENABLE_GDR: 1
    gdr_confirmed_by: >-
      Tunecache dslash policy keys carry p2p=7,gdr=1 on the multi-rank legs, and UCX_PROTO_INFO=y
      tables on the inter-node configuration show "rendezvous data fetch into cuda/GPU0 from cuda"
      by zero-copy RDMA reads striped over two HCAs, for the large-volume dslash
    QUDA_ENABLE_P2P: unset (deliberately); peer-to-peer was enabled between every on-board neighbour pair
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    OMP_NUM_THREADS: 16
    OMP_PROC_BIND: spread
    OMP_PLACES: cores
    cpu_binding: >-
      Launcher mapping --map-by slot:PE=36 --bind-to core: local ranks 0-3 on cores 0-35,
      36-71, 72-107 and 108-143, each on the socket of the GPU QUDA assigns it. ibrun's own
      default at several tasks per node alternates ranks between sockets instead.
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset, QUDA selects the device by local rank.
    resource_path: Fresh writable tunecache directory per leg for gpu-gb200.
    test_executables: Installed usqcd/bin tests.
  tests:
    - name: staggered_dslash_test_single_gpu
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      precision: single
      lattice: [4, 4, 4, 8]
      l2_relative_deviation: 3.576651e-9
      result: pass
    - name: staggered_invert_test_single_gpu
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      arguments: --prec double --enable-testing true
      iterations: 182
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.638284e-7
      result: pass
    - name: io_test_single_rank
      filter: Gauge/GaugeIOTest.*
      precisions: [double, single]
      qio_write_status: 0
      qio_read_status: 0
      result: pass
    - name: staggered_dslash_test_8_rank_gdr
      filter: StaggeredDslashTest.verify
      operator: asqtad MatPC
      legs:
        - {local_lattice: [6, 6, 6, 8], precision: single, l2_relative_deviation: 4.034328e-12}
        - {local_lattice: [16, 16, 8, 16], precision: double, l2_relative_deviation: 0.0}
      reachability: every leg's tunecache holds dslash policy keys with p2p=7 and gdr=1
      registration_errors: 0
      result: pass
    - name: staggered_invert_test_8_rank_gdr
      filter: EvenOdd/StaggeredInvertTest.verify/cg_mat_pc_direct_pc_double_l2
      arguments: --prec double --enable-testing true
      local_lattice: [6, 6, 6, 8]
      iterations: 181
      requested_l2_relative_residual: 1.0e-6
      true_l2_relative_residual: 9.566184e-7
      result: pass
    - name: io_test_8_rank
      filter: Gauge/GaugeIOTest.*
      directory: $HOME (VAST over NFS)
      qio_write_status: 0
      qio_read_status: -14
      failure: QIO_compare_checksum reports a checksum mismatch on read-back
      result: fail
  scope_limits:
    - Multi-rank QIO gauge I/O FAILS a checksum on read-back (status -14) on $HOME, which is VAST over NFS. The single-rank io_test passes. The cause is the open upstream defect in software/qio/parallel-singlefile-writes.md (qio#19, quda#1655); this is its first observation on Horizon, where no Lustre filesystem exists to avoid it. Multi-rank QIO writes through this stack are unsafe on $HOME and $SCRATCH.
    - Validated on the early-access layout, where one scheduler node is a four-GPU NVL4 board. The documented two-GPU node has not been available to run on.
    - Every multi-rank leg ran with ranks bound to their GPU's socket. Several unbound ranks on one node with OMP_PROC_BIND set pin every rank's threads to the same cores; see notes.md before launching any other way.
    - The MILC interface was compiled here; the composed MILC executable is validated separately by milc-cuda13-quda-ks-spectrum-2026q3.
    - The profile compiled eigensolver support, but no eigensolve or deflated solve was exercised.
    - The selected inverter case checked the L2 residual; its heavy-quark tolerance was inactive.
    - Every leg populated a fresh tunecache; this is validation, not benchmark evidence.
evidence: experiment
observed: "2026-09-29"
observed_on:
  machine: horizon
  node_type: gpu-gb200
  software:
    quda:
      commit: 00c7ef33dacadfb94860e3ca1cc06862926182dc
      branch: develop
  toolchain:
    cuda: 13.3.73
    host_compiler: NVHPC 26.9 through Open MPI 5.0.11 wrappers
    ucx: 1.22.0
sources:
  - https://github.com/lattice/quda/blob/00c7ef33dacadfb94860e3ca1cc06862926182dc/lib/targets/cuda/target_cuda.cmake#L120-L130
  - https://github.com/lattice/quda/blob/00c7ef33dacadfb94860e3ca1cc06862926182dc/tests/staggered_invert_test_gtest.hpp#L19-L35
