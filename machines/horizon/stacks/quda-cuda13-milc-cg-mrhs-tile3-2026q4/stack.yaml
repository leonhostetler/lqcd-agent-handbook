validation:
  date: "2026-10-10"
  submitted_by: operator
  reviewed_by: agent
  result: pass
  resources:
    nodes: 4
    mpi_ranks: 16
    ranks_per_node: 4
    cpus_per_rank: 36
    gpus_per_rank: 1
    visible_gpu_devices_per_rank: 4
    accelerator: NVIDIA GB200
    accelerator_memory_mib: 189471
    compute_capability: "10.0"
    scheduler_node: Early access; one scheduler node is a whole four-GPU GB200 NVL4 board (see machines/horizon/notes.md).
    partition: debug
    exclusive: true
    launcher: >-
      The staggered-CG throughput probe's ladder: one rank through ibrun -n 1 -o 0 (unbound,
      OMP_PROC_BIND=false), and 4, 8 and 16 ranks on one, two and four boards through ibrun with
      OPENMPI_AFFINITY="--map-by slot:PE=36 --bind-to core" (OMP_PROC_BIND=spread)
    rank_grids: [[1, 1, 1, 1], [2, 2, 1, 1], [2, 2, 1, 2], [2, 2, 2, 2]]
  runtime:
    communication: QMP over Open MPI 5.0.11 with UCX 1.22.0
    UCX_TLS: unset (deliberately; UCX default transport list)
    QUDA_ENABLE_GDR: 1
    gdr_confirmed_by: every job's tunecache holds dslash policy keys with gdr=1, and p2p=7 on the multi-rank points
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    OMP_NUM_THREADS: 32
    OMP_PLACES: cores
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset, QUDA selects the device by local rank.
    resource_path: A fresh, job-private tunecache per job, filled by a tuning pass before the measured pass.
    test_executables: Installed bin tests.
  tests:
    - name: staggered_dslash_test_one_gpu_verified
      arguments: --dslash-type hisq --prec double --recon 13 --verify true, row-major rank order
      local_lattice: [40, 40, 40, 40]
      right_hand_sides: [1, 12]
      maximum_l2_relative_deviation: 2.220446e-16
      result: pass
    - name: staggered_invert_test_one_gpu_host_verified
      arguments: --dslash-type hisq --inv-type cg --prec double --prec-sloppy half --recon 13 --recon-sloppy 9 --mass 0.01 --tol 1e-8 --verify true
      local_lattice: [40, 40, 40, 40]
      solves: 54, 6 one at a time and 48 in blocks of 12 through invertMultiSrcQuda (--nsrc-tile 12)
      iterations: 2556-2567
      maximum_host_l2_relative_residual: 9.998836e-9
      result: pass
    - name: staggered_invert_test_multi_rank
      arguments: as the one-GPU test, without host verification
      points: [4 ranks on one board, 8 ranks on two boards, 16 ranks on four boards]
      local_lattice: [40, 40, 40, 40]
      solves: 54 per point
      iterations: 2561-2587
      maximum_true_l2_relative_residual: 9.994827e-9
      rank_order: every log prints row major, matching MILC's
      result: pass
  scope_limits:
    - Host verification ran on one GPU only; the multi-rank points checked convergence and the true residual QUDA reports, and the composed MILC stack's cross-geometry consistency checks the multi-rank results.
    - QUDA_MAX_MULTI_RHS_TILE is 3, so a 12-right-hand-side block runs as four tiles; the tile is a build option and a stack built without it is a different stack.
    - QIO was not exercised. Multi-rank QIO writes are unsafe on $HOME and $SCRATCH because of the open upstream defect in software/qio/parallel-singlefile-writes.md, which quda-cuda13-milc-cg-2026q3 observed on Horizon.
    - The installed libqmp's QMP_binary_reduction sums multi-byte values wrongly on more than one rank (software/qmp/binary-reduction.md); MILC's printed NERSC CKSUM is its only MILC caller.
    - The profile compiled eigensolver support, but no eigensolve or deflated solve was exercised.
    - Validated on the early-access layout, where one scheduler node is a four-GPU NVL4 board.
