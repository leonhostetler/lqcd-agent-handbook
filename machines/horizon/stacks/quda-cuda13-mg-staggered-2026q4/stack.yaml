schema_version: 1
machine: horizon
software: quda
profile: mg-staggered
validated_on:
  - gpu-gb200
tested_software:
  quda:
    commit: ba501e4f8c661a84e73ac0f50ab56bfecbcdd28e
    branch: develop
tested_dependencies:
  qmp:
    commit: 3010fef5b5784b3e6eeec9fff38cb9954a28ad42
    requested_revision: 3010fef
    branch_context: Detached revision selected by QUDA; no branch asserted.
  qio:
    commit: 273841537392f9465d229c957228755e923408eb
    requested_revision: qio3-0-0
    branch_context: Tag selected by QUDA; no branch asserted.
  eigen:
    version: 3.4.0
    requested_revision: e67c494cba7180066e73b9f6234d0b2129f1cdf5, an archive URL selected by QUDA
  cccl:
    commit: 413d2efd811ebb2ca0333a281d04a2de838ecad6
    requested_revision: v3.3.4
    branch_context: Tag selected by QUDA; no branch asserted.
tested_toolchain:
  modules: [nvidia/26.9, cuda/13.3, openmpi/5.0.11, ucx/1.22.0]
  host_compiler:
    module: nvidia/26.9
    version: NVHPC 26.9 (nvc, nvc++)
    wrappers:
      c: mpicc
      cxx: mpicxx
  cuda:
    module: cuda/13.3
    runtime_version: 13.3
  driver: 615.71.09 (nvidia-smi reports CUDA UMD version 13.4)
  mpi:
    module: openmpi/5.0.11
    transport: UCX 1.22.0 from the loaded ucx module
  cmake: 3.31.8, the system cmake (cmake-3.31.8-1.el10); the build script unloads the cmake module, which module reset loads by default, and asserts the version
build:
  type: RELEASE
  target: CUDA
  gpu_arch: sm_100
  generator: Unix Makefiles
  install_layout: <build-dir>/usqcd
  profile_options_from: software/quda/build-profiles.yaml#mg-staggered
  machine_options:
    CMAKE_C_COMPILER: mpicc
    CMAKE_CXX_COMPILER: mpicxx
    QUDA_TARGET_TYPE: CUDA
    QUDA_GPU_ARCH: sm_100
    CMAKE_INSTALL_PREFIX: <build-dir>/usqcd
    CMAKE_INSTALL_LIBDIR: lib
  dependency_acquisition:
    mode: QUDA CMake downloads
    network_required_at_configure: true
  cost:
    where: batch
    command: cmake --fresh -S <quda-checkout> -B <build-dir> <options>, then cmake --build <build-dir> --parallel 64, then cmake --install <build-dir>
    parallelism: 64
    wallclock: 36m36s in all (configure 87 s, build 2102 s, install 7 s)
    timing_scope: Wall-clock timestamps around each stage in one batch job on one GB200 board. Configure includes downloading QMP, QIO, Eigen and CCCL. The QUDA checkout was cloned beforehand, outside the timed stages. The build compiles every test (QUDA_BUILD_ALL_TESTS).
    maximum_reported_rss_kib: not measured
    memory_scope: Not measured; /usr/bin/time is not installed on Horizon, and no other sampler ran.
  installed_libraries:
    - {path: lib/liblime.so, sha256: 06126ccc120e3bae1ec79bdd91da91344b8d25525ac61152ecd88c449c177d2f}
    - {path: lib/libqio.so, sha256: eee0c19d4e299c344bf7ddb7e7eea4ff69ab407d5cf44892b80a7e34605705a2}
    - {path: lib/libqmp.so, sha256: e29d70dd001731e3a858d8efd0911711f2e9fd7bbed6a8d6213c8a2e918eb343}
    - {path: lib/libquda.so, sha256: b9fc3740f0e6ebbde5ba7b004f6c9163a5ea1874e2075a792838013a2e4c9686}
    - {path: lib/libquda_test.so, sha256: 10c2117366630c3314ead8a1857fdabc80263fda45dce303df57cbf15ff0d884}
  record_checks:
    - tool: tools/check-stack-build-record.py
      version: 1.0.0
      date: "2026-10-22"
      mode: cmake
      evidence:
        - the build log, which echoes the configure command
        - the build's CMakeCache.txt
        - the QUDA source checkout at the tested commit
      errors: 0
      undecided: 0
      not_cross_checked: 39
      environment_defaults: [QUDA_NVSHMEM_HOME]
validation:
  date: "2026-10-21"
  submitted_by: agent, under the operator's campaign grant
  reviewed_by: agent
  result: pass
  resources:
    nodes: 1
    mpi_ranks: 4
    ranks_per_node: 4
    cpus_per_rank: 36
    gpus_per_rank: 1
    visible_gpu_devices_per_rank: 4
    accelerator: NVIDIA GB200
    accelerator_memory_mib: 189471
    compute_capability: "10.0"
    scheduler_node: Early access; one scheduler node is a whole four-GPU GB200 NVL4 board (see machines/horizon/notes.md).
    partition: debug
    exclusive: true
    launcher: >-
      ibrun on the batch node of a two-board allocation, narrowed to it through the SLURM_*
      allocation variables (machines/horizon/notes.md, concurrent launches on disjoint nodes), with
      OPENMPI_AFFINITY="--map-by slot:PE=36 --bind-to core" (OMP_PROC_BIND=spread); a placement probe
      showed each rank on its own 36-core block
    rank_grid: [1, 1, 1, 4]
  runtime:
    communication: QMP over Open MPI 5.0.11 with UCX 1.22.0
    UCX_TLS: unset (deliberately; UCX default transport list)
    QUDA_ENABLE_GDR: 1
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    OMP_NUM_THREADS: 32
    OMP_PLACES: cores
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset, QUDA selects the device by local rank.
    resource_path: A fresh, job-private tunecache.
    test_executables: Installed bin tests.
    loaded_libraries: libquda, libqmp, libqio and liblime checked against installed_libraries before launch
  tests:
    - name: staggered_invert_test
      execution_path: native non-GTest
      arguments: >-
        --dslash-type asqtad --compute-fat-long true --unit-gauge true --dim 16 16 16 32 --gridsize 1 1 1 4
        --prec double --prec-sloppy single --prec-precondition single --prec-null single --recon 18
        --recon-sloppy 18 --recon-precondition 18 --mass 0.1 --tol 1e-6 --tolhq 1e-6 --niter 1000
        --inv-type gcr --solve-type direct --solution-type mat --ngcrkrylov 8 --pipeline 0
        --inv-multigrid true --mg-levels 3 --mg-staggered-coarsen-type kd-optimized
        --mg-block-size 0 1 1 1 1 --mg-nvec 0 3 --mg-nvec-batch 0 1 --mg-setup-use-mma 0 false
        --mg-smoother-solve-type 0 direct-pc --mg-block-size 1 4 4 4 4 --mg-nvec 1 64
        --mg-nvec-batch 1 8 --mg-setup-use-mma 1 true --mg-smoother-solve-type 1 direct
        --mg-allow-truncation false --verify true
      operator: asqtad full system
      outer_solver: gcr
      preconditioner: multigrid
      gauge: synthetic unit gauge
      global_lattice: [16, 16, 16, 32]
      local_lattice: [16, 16, 16, 8]
      hierarchy:
        - level: 0
          transfer: optimized-kd
          nvec: 3
          block: [1, 1, 1, 1]
          smoother_solve_type: direct-pc
        - level: 1
          transfer: aggregate
          nvec: 64
          block: [4, 4, 4, 4]
          smoother_solve_type: direct
        - level: 2
          role: bottom
      iterations: 18
      requested_l2_relative_residual: 1.0e-6
      quda_l2_relative_residual: 7.750808e-7
      host_l2_relative_residual: 7.750808e-7
      quda_heavy_quark_residual: 1.793695e-7
      host_heavy_quark_residual: 1.793695e-7
      result: pass
  scope_limits:
    - The native test ran on one board only. The library's multi-rank and multi-board MG path, and GPU-Direct RDMA across boards, are validated through the composed milc-cuda13-quda-ks-spectrum-mg-2026q4 stack, not by a native test.
    - Validation covers the listed native hierarchy, plus the four-level hierarchy the composed MILC stack ran. No other level count, aggregation block, near-null count or coarse solver is validated.
    - The profile compiled plain and deflated CG and a coarsest-level eigensolver; no CG eigensolve, coarsest-level deflation or deflated solve was exercised.
    - QIO was compiled but not exercised. Multi-rank QIO writes are unsafe on $HOME and $SCRATCH because of the open upstream defect in software/qio/parallel-singlefile-writes.md.
    - The installed libqmp's QMP_binary_reduction sums multi-byte values wrongly on more than one rank (software/qmp/binary-reduction.md).
    - The run populated a fresh tunecache and is functional validation, not benchmark evidence. No setup or solve timing is recorded here.
    - Validated on the early-access layout, where one scheduler node is a four-GPU NVL4 board.
evidence: experiment
observed: "2026-10-21"
observed_on:
  machine: horizon
  node_type: gpu-gb200
  software:
