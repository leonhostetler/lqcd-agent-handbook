    branch: develop
tested_dependencies:
  qmp:
    commit: 3010fef5b5784b3e6eeec9fff38cb9954a28ad42
    requested_revision: 3010fef
    branch_context: Detached revision selected by QUDA; no branch asserted.
  qio:
    commit: 273841537392f9465d229c957228755e923408eb
    requested_revision: qio3-0-0
    branch_context: Tag selected by QUDA; no branch asserted.
tested_toolchain:
  modules: [nvidia/26.9, cuda/13.3, openmpi/5.0.11, ucx/1.22.0]
  host_compiler:
    module: nvidia/26.9
    version: NVHPC 26.9 (nvc, nvc++)
    wrappers:
      c: mpicc
      cxx: mpicxx
  cuda:
    module: cuda/13.3
    runtime_version: 13.3
  driver: 615.71.09 (nvidia-smi reports CUDA UMD version 13.4)
  mpi:
    module: openmpi/5.0.11
    transport: UCX 1.22.0 from the loaded ucx module
build:
  type: optimized double precision with debug information
  target: CUDA
  gpu_arch: sm_100
  generator: GNU Make
  install_layout: <install-dir>/bin/ks_spectrum_hisq, installed from <milc-checkout>/ks_spectrum
  profile_options_from: software/milc/build-profiles.yaml#ks-spectrum-hisq-quda-mg
  portable_recipe: software/milc/applications/ks-spectrum.md
  nearest_application_stack: machines/horizon/stacks/milc-cuda13-quda-mrhs-tile3-ks-spectrum-2026q4/stack.yaml
  machine_options:
    OFFLOAD: CUDA
    MY_CC: mpicc
    MY_CXX: mpicxx
    COMPILER: gnu
    ARCH: ""
    GPU_ARCH: nvidia
    OPT: -O3 -Ofast -g
    LDFLAGS: -g -fopenmp -lcuda -lnvidia-ml
    QUDA_HOME: <quda-install-prefix>
    QMPPAR: <quda-install-prefix>
    QIOPAR: <quda-install-prefix>
    WANT_KS_CONT_GPU: false
    WANTPRIMME: false
  dependency_acquisition:
    mode: existing validated QUDA stack installation
    composed_profile: software/quda/build-profiles.yaml#mg-staggered
    validated_stack: machines/horizon/stacks/quda-cuda13-mg-staggered-2026q4/stack.yaml
    network_required: false
  cost:
    where: batch
    command: make -j 1 ks_spectrum_hisq
    parallelism: 1
    wallclock: 194 s
    timing_scope: Wall-clock timestamps around the make command, in the batch job that built the QUDA stack, from a checkout with no objects in ks_spectrum; it compiled the application objects and the dependent MILC libraries and linked the executable.
    maximum_reported_rss_kib: not measured
    memory_scope: Not measured; /usr/bin/time is not installed on Horizon, and no other sampler ran.
  record_checks:
    - tool: tools/check-stack-build-record.py
      version: 1.0.0
      date: "2026-10-22"
      mode: make
      target: ks_spectrum_hisq
      evidence:
        - the make command as the make log's first line echoes it; the build script assembles it from arrays
        - ks_spectrum/Makefile of the checkout, identical to the repository Makefile
        - the make log, which carries no MILC commit header (the check's one warning); the build job verified the checkout's commit before building
        - the MILC source checkout at the tested commit
      errors: 0
      undecided: 0
validation:
  date: "2026-10-22"
  submitted_by: agent, under the operator's campaign grant
  reviewed_by: agent
  result: pass
  resources:
    nodes: 2
    accelerator: NVIDIA GB200
    accelerator_memory_mib: 189471
    compute_capability: "10.0"
    scheduler_node: Early access; one scheduler node was a four-GPU NVL4 board (see the composed QUDA stack).
    partition: debug
    exclusive: true
    global_lattice: [72, 96, 48, 48]
    legs:
      - {name: one-board, mpi_ranks: 4, node_geometry: [2, 2, 1, 1], local_lattice: [36, 48, 48, 48], launch: "ibrun on the batch node, the SLURM_* allocation variables narrowed to it; --map-by slot:PE=36 --bind-to core"}
      - {name: two-boards, mpi_ranks: 8, node_geometry: [2, 2, 2, 1], local_lattice: [36, 48, 24, 48], dimensions_off_node: [z], launch: "full allocation, --map-by slot:PE=36 --bind-to core"}
  runtime:
    communication: QMP over Open MPI 5.0.11 with UCX 1.22.0
    outer_solver: GCR on the full staggered system with a QUDA multigrid preconditioner
    milc_inverter_selector: MG, in a multimass set with rebuild_type THIN; a second multimass set with UML as the reference arm
    hierarchy_levels: 4
    hierarchy: >-
      optimized-kd transfer at level 0; aggregation blocks 6 6 6 4 (nvec 64) and 3 2 2 3 (nvec 96);
      no coarsest-level deflation (nvec 3 0, deflate_n_ev 0); half-precision preconditioner;
      use_mma true; dagger_approximation true; CA-GCR smoothers; generated in the run, not loaded
    UCX_TLS: unset (deliberately; UCX default transport list)
    QUDA_ENABLE_GDR: 1
    gdr_confirmed_by: the two-board leg's tunecache holds dslash policy keys with gdr=1 and p2p=7 on the communicating policies (tools/quda-tunecache-policies.py --expect-gdr 1)
    QUDA_ENABLE_P2P: unset (deliberately)
    QUDA_DETERMINISTIC_REDUCE: unset (deliberately)
    QUDA_MILC_HISQ_RECONSTRUCT: 13
    QUDA_MILC_HISQ_RECONSTRUCT_SLOPPY: 9
    OMP_NUM_THREADS: 32
    OMP_PROC_BIND: spread
    OMP_PLACES: cores
    gpu_binding: None; CUDA_VISIBLE_DEVICES unset, QUDA selects the device by local rank.
    quda_resource_path: Job-private per leg. The first job started each leg from an empty tunecache; the second started each leg from a copy of the first job's tunecache for the same placement.
    loaded_libraries: libquda, libqmp, libqio and liblime checked against the composed stack's installed_libraries, and ldd required to resolve libquda.so from that install, before launch
  tests:
    - name: input_proofread
      input: one warm 72x96x48x48 field, one point source at the origin, the MG and UML multimass sets at one mass; proofread clean through tools/milc-proofread-input.sh, which echoed effective_mg_rebuild_type propagator 0 THIN
      result: pass
    - name: mg_hierarchy_construction
      markers:
        - "mat_invert_mg_field_gpu: setting up the MG inverter"
        - "mat_invert_mg_field_gpu: MG inverter setup complete"
        - "Transfer: using block size 1 x 1 x 1 x 1, then 6 x 6 x 6 x 4, then 3 x 2 x 2 x 3, at both placements"
        - "mat_invert_mg_field_gpu: fresh-link signal consumed by hierarchy creation; no first-solve MG update"
      note: Observed in both jobs, at the light mass and at 0.5.
      result: pass
    - name: mg_execution_path
      implementation_marker: "fn_QUDA_MG timer lines on every MG solve; no CG or UML fallback warning"
      result: pass
    - name: residual_target_attainment
      mass: 0.5
      requested_l2_relative_residual: 1.0e-8
      mg_arm: three solves (one per colour) per leg, GCR 6-7 iterations, true residual 3.9e-10 to 5.7e-9
      uml_arm: three solves per leg, 49 CG iterations on the even sites, true residual at most 8.5e-9
      note: Every solve met the target at both placements, and MILC reported each converged.
      result: pass
    - name: cross_solver_correlator_agreement
      tool: tools/milc-compare-fnal-correlators.py 1.1.0, limit 1e-6 against the reference correlator's scale
      reference_arm: the UML set's POINT_PION correlator, same field, source, mass and placement
      largest_relative_difference: 2.721e-14 at both placements
      result: pass
    - name: cross_geometry_agreement
      tool: tools/milc-compare-fnal-correlators.py 1.1.0, limit 1e-6
      reference: the one-board UML correlator
      largest_relative_difference: 2.721e-24 for the two-board UML correlator, 2.721e-14 for the two-board MG correlator
      result: pass
    - name: placement
      probe: one line per rank with host and allowed CPUs, launched with the leg's launcher
      outcome: four ranks per board, each on its own 36-core block, on the intended hosts
      result: pass
    - name: application_completion
      terminal_marker: RUNNING COMPLETED
      result: pass
  scope_limits:
    - The solve and correlator checks ran at quark mass 0.5 on a synthetic, strongly disordered warm field (plaquette 0.337). At a light mass (below 0.02) on the same field, an earlier job built the hierarchy at both placements but no MG solve converged within a 40-minute leg limit; MG convergence at a physical light mass on a real configuration is not validated by this record.
    - Validation exercised one four-level hierarchy at two placements on one field. No other level count, aggregation block, near-null count, coarse solver, coarsest-level deflation, rank decomposition or node count is validated.
    - Hierarchy setup ran from scratch in the run; loading stored near-null vectors (QIO) was not exercised.
    - The THIN rebuild path's first-solve handling was exercised; a later rebuild after a link change (a second set or configuration) was not.
    - MILC's printed NERSC CKSUM differs between geometries; it is QMP's binary-reduction defect (software/qmp/binary-reduction.md), not the field. It was not used as a check.
    - Deflated CG, QIO file I/O, Gaussian smearing, gauge-force and fermion-force paths were compiled but not exercised. Multi-rank QIO writes are unsafe on $HOME and $SCRATCH (software/qio/parallel-singlefile-writes.md).
    - The NVHPC link records the QUDA install in DT_RUNPATH, which LD_LIBRARY_PATH outranks; the validation guarded against that with ldd before launch.
    - No solver timing, setup cost or crossover is recorded here; the runs were functional validation, partly from a warmed tunecache, and are not benchmark evidence.
    - Validated on the early-access layout, where one scheduler node is a four-GPU NVL4 board.
