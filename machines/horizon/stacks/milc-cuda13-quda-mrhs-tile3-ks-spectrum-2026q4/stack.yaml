      commit: a5f8f9fa2b473abb2cf2b4465a34ae4b71c5e785
      branch: develop
    quda:
      commit: ba501e4f8c661a84e73ac0f50ab56bfecbcdd28e
      branch: develop
  toolchain:
    cuda: "13.3"
    host_compiler: NVHPC 26.9 through Open MPI 5.0.11 wrappers
    ucx: 1.22.0
