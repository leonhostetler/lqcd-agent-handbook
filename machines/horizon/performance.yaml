- id: campaign-multishift-10-masses
  kind: campaign
  stack: machines/horizon/stacks/milc-cuda13-quda-mrhs-tile3-ks-spectrum-2026q4/stack.yaml
  workload: 'A production spectroscopy campaign on an 80³×144 HISQ ensemble, ks_spectrum_hisq: per configuration, 48 multi-shift
    CG solves over 10 light valence masses at residual 1e-8, from random-colour and even-odd wall sources
    on 4 time slices. Its single-mass heavy-quark solves, under 800 iterations each, are left out: they
    measure per-call overhead.'
  library_evidence: The production executable is the build the stack validated (same sha256), and its
    run path resolves libquda, libqmp and libqio from the install whose hashes the QUDA stack records;
    the benchmark jobs did not list loaded libraries.
