proposal:
  type: new-leaf
  title: QIO field layout binding, partfile versus single-file
  proposed_path: software/quda/internals/vector-io-layout.md
  alternative_placement: >-
    Fold into software/quda/solvers/staggered-multigrid.md under "Reuse, updates, and cleanup",
    with a cross-reference from software/qio/README.md. A separate internals leaf is proposed
    because the mechanism sits at the QIO/DML layer and governs any QUDA field save or load,
    not only staggered-multigrid near-null vectors.
  scope: [software:quda, software:qio, software:milc]
  load_when: >-
    Saving or loading QUDA vector fields such as near-null vectors or eigenvectors, choosing a
    save format for fields intended to outlive one job, or changing rank decomposition for a run
    that reuses stored fields.
  durability: durable
  evidence: mixed
  evidence_breakdown: >-
    The partfile binding and its failure path are source-derived, with one runtime confirmation.
    The single-file counterpart and its I/O-time cost are operator-supplied practitioner
    knowledge, unmeasured in this campaign and labelled as such throughout.

claim: >-
  A QUDA field written in QIO partfile format can only be read back by a job whose rank
  decomposition reproduces the writing job's I/O layout. Matching global lattice, hierarchy,
  block sizes, vector count, precision, executable, and gauge field do not make such a field
  loadable under a different rank-grid factorization, and matching the total rank count is not
  sufficient either: the factorization itself must match. A single-file save carries no such
  binding and is the portable alternative, at the cost of I/O time that grows with rank count.

mechanism:
  - >-
    QUDA's field I/O runs through QIO in lib/qio_field.cpp. write_spinor_field selects
    QIO_PARTFILE when partfile output is requested and QIO_SINGLEFILE otherwise.
  - >-
    Partfile output produces one .volNNNN file per I/O partition. Each part embeds a DML
    sitelist enumerating the global sites that part holds, which encodes the writing layout.
  - >-
    Both read_spinor_field and read_gauge_field open with volfmt QIO_UNKNOWN, so QIO autodetects
    the on-disk format. Format autodetection is therefore not a compatibility check; detection
    succeeds first and the layout check fails afterwards.
  - >-
    QUDA calls set_layout() from the current job's local geometry before opening. QIO then
    validates the embedded sitelist against that layout in DML_read_sitelist.
  - >-
    On mismatch the read fails at file-open time, before any field data is consumed. The observed
    diagnostic chain is the DML_read_sitelist message that the sitelist does not conform to the
    I/O layout, then a QIO_read_check_sitelist site-list read error, then QIO_open_read returning
    NULL, then a QUDA "Open file failed" error raised from qio_field.cpp, which aborts the job.
  - >-
    A single-file record holds the whole field in one file rather than one file per partition, so
    there is no per-partition sitelist for a reader to reject. This is the mechanism consistent
    with the operator-supplied behaviour below; it was not separately confirmed from QIO source
    during this session.

operator_supplied:
  attribution: operator
  evidence: operator-experience
  status: >-
    Supplied directly by the operator as established practitioner knowledge. Not measured in this
    campaign and not derived from source during this session. Recorded verbatim in substance and
    deliberately left unquantified.
  facts:
    - >-
      Single-file format is a genuine workaround for the partfile binding. Single-file saves are
      not decomposition dependent and can be read back under a different rank decomposition.
    - >-
      The drawback of single-file format is significantly increased I/O time when running on many
      ranks. No threshold, coefficient, or crossover rank count is supplied, and none should be
      inferred; the effect is reported as a direction, not a fitted quantity.
  consequence: >-
    Save format becomes a deliberate lifecycle decision rather than a default. Partfile suits
    fields written and read at one fixed placement, where its parallel I/O is the point.
    Single-file suits fields intended to outlive a placement choice, and its cost is paid at
    every write and read, scaling with rank count.

actionable_consequence:
  - >-
    Choose the save format from the intended lifetime of the field, not from write speed alone.
    If the stored field may ever be read at a different decomposition, partfile makes that
    impossible without regeneration, and the cost of that constraint is only discovered later.
  - >-
    Treat the writing rank geometry and the resulting part count as part of a stored partfile
    field's identity, and record them wherever the artifact is referenced. A stored set whose
    part count differs from the reading job's rank count will not load.
  - >-
    Reusing saved partfile vectors constrains placement independently of hierarchy legality. A
    decomposition or memory preflight that validates block legality, aggregate limits, compiled
    coarse colours, and capacity does not cover stored I/O layout, and will pass on a
    configuration that cannot load its own inputs.
  - >-
    When a study must vary rank decomposition over stored fields, there are three options with
    different costs: match the writing placement, regenerate the fields under the new placement,
    or hold the fields in single-file format and pay the I/O time. Price the option against the
    study rather than assuming regeneration is the only route.
  - >-
    The partfile failure is deterministic and consumes the full job launch before aborting, so it
    is worth screening offline rather than discovering it inside an allocation.

not_claimed:
  - >-
    No quantitative claim about single-file I/O cost. The operator reports a significant increase
    with many ranks and supplies no numbers; any threshold or crossover must be measured on the
    target stack and workload.
  - >-
    No claim that single-file layout independence was verified from QIO source or measured
    through QUDA VectorIO during this session. It is recorded on operator authority, consistent
    with the side evidence below.
  - >-
    No claim about the cost, quality, or reproducibility of regenerating near-null vectors under
    a new placement.
  - >-
    No claim about whether any other QUDA or MILC I/O path shares the partfile binding beyond the
    qio_field.cpp functions named above.
  - >-
    No performance, memory, or hierarchy conclusion follows from this failure mode.

observation_context:
  software:
    quda:
      commit: b6998853f6b605e22d67ea2ddfa3cab0d752679a
      branch: develop
    milc:
      commit: 6b9b8a06eec5746187bbfd197eac2629ab8d8e72
      branch: develop
  machine: perlmutter
  node_type: gpu-a100-40
  placement: 32 MPI ranks over 8 four-GPU nodes, one rank per GPU
  toolchain: matches the quda-cuda13-mg-staggered-2026q3 stack toolchain
  confirmation: >-
    A staggered-multigrid level-1 near-null vector set written in partfile format by a 32-rank
    job failed to load in a later 32-rank job that used a different rank-grid factorization. All
    32 ranks reported the sitelist diagnostic; rank 0 raised the open-file error and aborted. No
    vector load, transfer construction, terminal solve, or outer cycle was reached. Rank count
    was identical across the two jobs, which is what isolates the factorization rather than the
    rank count as the binding quantity.
  singlefile_side_evidence: >-
    In the same failing run, a SCIDAC single-file gauge configuration was read successfully in
    parallel with matching checksums under the changed factorization. That read went through the
    application's own parallel reader rather than QUDA VectorIO, so it is consistent with the
    operator-supplied single-file behaviour without independently establishing it.
  offline_screens_passed: >-
    The decomposition and memory preflights for the failing configuration both passed. This is
    the practical reason the rule is worth publishing: existing tooling cannot detect it.

why_it_changes_an_action: >-
  Handbook guidance currently treats rank decomposition as a legality-and-capacity question,
  resolved by the decomposition preflight and the memory model, and treats reusable state as a
  hierarchy or tunecache concern. Neither covers stored field layout, and no current leaf tells
  an agent that save format determines whether a stored field survives a placement change.
  Without this fact an agent can build a source-valid, memory-feasible placement trial that
  reuses saved vectors, pass every offline gate, and lose the allocation at file open. With it,
  save format becomes a decision made once at write time, and placement changes over stored
  fields become a screened tradeoff made before submission.

suggested_cross_references:
  - path: software/quda/solvers/staggered-multigrid.md
    note: >-
      "Reuse, updates, and cleanup" already covers hierarchy lifecycle and the static-pointer and
      parameter-file traps. Stored-vector layout binding belongs alongside those as another
      lifecycle boundary, and the tunables section lists vector I/O without noting that the
      format choice constrains later placement.
  - path: software/quda/solvers/staggered-multigrid/tuning.md
    note: >-
      Gate 2 establishes source legality and stack proof; a stored-field placement check fits
      there.
  - path: software/qio/README.md
    note: >-
      This leaf currently routes QIO linkage and demonstrated I/O scope. Partfile versus
      single-file layout binding, and the I/O-time tradeoff between them, is QIO-level knowledge.

