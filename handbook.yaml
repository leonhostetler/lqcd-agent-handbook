name: lqcd-agent-handbook
phase: bootstrap
schema_versions:
  machine: 2
  project: 2
  build_profiles: 1
  stack: 1
  ensemble: 1
tier_0:
  canonical_entrypoint: AGENTS.md
  mirrors:
    - CLAUDE.md
  files:
    - AGENTS.md
    - INDEX.md
  max_combined_bytes: 6144
  max_entrypoint_bytes: 5632
developer_docs:
  files:
    - ARCHITECTURE.md
    - ROADMAP.md
  max_combined_bytes: 250000
  episode_record: DEVLOG.md
repository:
  name: lqcd-agent-handbook
  canonical_remote: https://github.com/leonhostetler/lqcd-agent-handbook.git
session_logging:
  runner: tools/run-session-logging-python
  checker: tools/check-session-logging.py
  installer: tools/install-session-logging.py
  playbook: playbooks/session-logging.md
  frontends:
    claude:
      logger: tools/log-session-claude.sh
    codex:
      logger: tools/log-session-codex.py
runtime_data:
  # Operational tools import only the standard library and read a generated JSON projection
  # of the YAML they consume, never the YAML (ARCHITECTURE.md §runtime-data).
  # tools/build-runtime-data.py writes it; the validator fails when it is stale or when a
  # tool listed here imports anything outside the standard library.
  generator: tools/build-runtime-data.py
  handbook_blocks: [session_logging, submission_guard]
  operational_tools:
    - tools/check-batch-script.py
    - tools/dry-run-batch-script.py
    - tools/submission-guard.py
    - tools/session_logging.py
    - tools/check-session-logging.py
    - tools/install-session-logging.py
    - tools/log-session-codex.py
    - tools/check-submission-guard.py
    - tools/install-submission-guard.py
    - tools/runtime_data.py
submission_guard:
  # PreToolUse interception of the scheduler submit command: refuses a script that has not
  # passed the checker and the dry-run harness. Offer-only installer; the shim it installs
  # carries no handbook path and acts only when LQCD_HANDBOOK names a live clone.
  guard: tools/submission-guard.py
  runner: tools/run-submission-guard
  harness: tools/dry-run-batch-script.py
  harness_runner: tools/run-dry-run-batch-script
  checker: tools/check-submission-guard.py
  installer: tools/install-submission-guard.py
  frontends:
    claude:
      hook: tools/submission-guard-hook.sh
    codex:
      hook: tools/submission-guard-hook.sh
launcher:
  handbook_env: LQCD_HANDBOOK
  launched_env: LQCD_HANDBOOK_LAUNCHED
  frontend_env: LQCD_HANDBOOK_FRONTEND
  startup_prompt: playbooks/start-session-prompt.txt
  frontends:
    claude:
      executable: tools/lqcd-claude
      entrypoint: CLAUDE.md
      skill: .claude/skills/lqcd-start-session/SKILL.md
      preflight: playbooks/start-session-claude.md
      complete_loading_env: CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD
    codex:
      executable: tools/lqcd-codex
      entrypoint: AGENTS.md
      skill: .agents/skills/lqcd-start-session/SKILL.md
      preflight: playbooks/start-session-codex.md
      complete_loading_env: LQCD_HANDBOOK_CODEX_BOOTSTRAP
