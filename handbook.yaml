name: lqcd-agent-handbook
phase: bootstrap
schema_versions:
  machine: 1
  project: 1
tier_0:
  files:
    - CLAUDE.md
    - INDEX.md
  max_combined_bytes: 6144
  max_claude_md_bytes: 5120
repository:
